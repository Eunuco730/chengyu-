<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>成语释义挑战</title>
    <style>
        :root { --page-bg: #f5fdf5; --btn-bg: #7ee081; --text-color: #333; --wrong: #e74c3c; --exit-color: #ff7675; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; }
        body { background-color: var(--page-bg); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
        .container { background: #fff; width: 100%; max-width: 440px; border-radius: 20px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; margin-top: 10px; position: relative; }
        .hidden { display: none; }
        .btn-exit { position: absolute; top: 15px; left: 15px; border: 1px solid var(--exit-color); color: var(--exit-color); background: none; padding: 5px 10px; border-radius: 8px; font-size: 0.7rem; cursor: pointer; }
        .menu-grid { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        button { width: 100%; background: var(--btn-bg); color: #fff; border: none; padding: 15px; font-size: 1.1rem; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .grade-box { font-size: 0.8rem; color: #666; margin: 10px 0; padding: 10px; background: #f9f9f9; border-radius: 10px; }
        .question { font-size: 1.5rem; font-weight: bold; margin: 20px 0; word-break: break-all; text-align: left; line-height: 1.4; }
        input { width: 100%; font-size: 1.5rem; padding: 15px; border: 3px solid #eee; border-radius: 12px; text-align: center; margin-bottom: 10px; }
        #answer-display { color: var(--wrong); font-weight: bold; min-height: 30px; margin-bottom: 10px; visibility: hidden; }
        .history-title { padding: 15px; color: #8e6fad; cursor: pointer; border-bottom: 1px solid #eee; font-weight: bold; }
        #history-list { display: none; max-height: 200px; overflow-y: auto; text-align: left; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9rem; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; word-break: break-all; }
        .row-wrong { color: var(--wrong); }
    </style>
</head>
<body>

<div id="setup-screen" class="container">
    <h2>成语释义挑战</h2>
    <div id="total-accuracy-box" class="hidden" style="background:#e8f5e9; padding:10px; border-radius:10px; font-weight:bold;">
        历史总正确率: <span id="total-acc">0%</span>
    </div>
    <div class="menu-grid">
        <button onclick="startQuiz(10)">10 题挑战</button>
        <button onclick="startQuiz(20)">20 题挑战</button>
        <button onclick="startQuiz(50)">50 题挑战</button>
        <button onclick="startQuiz(100)">100 题挑战</button>
        <!-- 新增：全部题目按钮 -->
        <button style="background: #52c41a;" onclick="startQuiz('all')">全部题目挑战 (812题)</button>
    </div>
    <div id="history-section" class="hidden">
        <div class="history-title" onclick="document.getElementById('history-list').style.display=this.nextElementSibling.style.display==='block'?'none':'block'">🕒 最近练习记录 (点击展开)</div>
        <div id="history-list"></div>
        <button style="background:white; color:red; border:1px solid red; margin-top:10px;" onclick="clearHistory()">清空历史数据</button>
    </div>
</div>

<div id="game-screen" class="container hidden">
    <button class="btn-exit" onclick="location.reload()">退出</button>
    <div id="timer" style="margin-top:30px; font-weight:bold;">00:00</div>
    <div class="grade-box" id="grade-standards"></div>
    <div class="question" id="q-val">--</div>
    <div id="answer-display">正确成语: <span id="hint-val"></span></div>
    <input type="text" id="answer-input" placeholder="输入成语" autocomplete="off">
    <div style="display:flex; gap:10px;">
        <button style="background:#ddd; color:#333;" onclick="document.getElementById('answer-display').style.visibility='visible'">看答案</button>
        <button onclick="nextStep()">确定</button>
    </div>
</div>

<div id="result-screen" class="container hidden">
    <h2>练习完成</h2>
    <p>得分：<span id="res-score"></span></p>
    <p>总用时：<span id="res-time"></span></p>
    <button onclick="location.reload()">返回首页</button>
    <table id="res-table"><thead><tr><th>题目(释义)</th><th>你的答案</th><th>正确答案</th><th>用时</th></tr></thead><tbody id="res-body"></tbody></table>
</div>

<script>
    // 完整812个成语及释义题库数据
    const data = [
        {p: "比喻借助别人的威势来吓唬、欺压他人。【贬义】", a: "狐假虎威"},
        {p: "不用想，“假”借助的意思。【中性】", a: "不假思索"},
        {p: "形容现象奇异、色彩繁杂。中性/略带贬义（可指怪诞）。", a: "光怪陆离"},
        {p: "形容色彩鲜艳、式样繁多。褒义/中性。", a: "五光十色"},
        {p: "比喻说话说三道四、闲言碎语，也指说话反复无常或当面一套背后一套", a: "称雨道晴"},
        {p: "对所讲述的事物非常熟悉、了解，能一一列举出来", a: "如数家珍"},
        {p: "战鼓和号角同时响起.原指古代军队出征或作战时的壮观场面，后也泛指声势浩大、气氛热烈的场景", a: "鼓角齐鸣"},
        {p: "形容接连不断地到来（多指人、事物或消息）。常考“连续不断”的义项。", a: "纷至沓来"},
        {p: "形容行人、车马等像水流一样连续不断。侧重于“流动不息”，与“络绎不绝”高度近义。", a: "川流不息"},
        {p: "形容人马、车船等前后相接，连续不断。与“纷至沓来”近义，但更强调“行进中的连续”。", a: "络绎不绝"},
        {p: "形容人多拥挤，肩膀挨着肩膀，脚尖碰着脚后跟。与“摩肩接踵”同义，侧重“拥挤”。", a: "比肩接踵"},
        {p: "形容长短、高低、水平等不一致，不整齐。常考“不统一、有差异”的义项。", a: "参差不齐"},
        {p: "指好人坏人混杂在一起，也指事物质量好坏不一。常考“品质/水平参差不齐”的义项。注意：它只用于人（品质）或物（质量），不用于描述长短高低。", a: "良莠不齐"},
        {p: "比喻好坏不同的人或事物混杂在一起。与“良莠不齐”近义，但“泥沙俱下”更侧重“混杂”的动态过程，可用于人或事物。", a: "泥沙俱下"},
        {p: "比喻相差很远，大不相同。常考“差别巨大、矛盾”的义项。", a: "大相径庭"},
        {p: "比喻没有人过问、探求或尝试。常考“受冷落、不被关注”的义项。", a: "无人问津"},
        {p: "指无关紧要，不值得重视。常考“不重要、没有分量”的义项。", a: "无足轻重"},
        {p: "形容宾客稀少、十分冷清。与“门可罗雀”近义，常考“人少、冷清”的义项。", a: "门庭冷落"},
        {p: "形容宾客稀少，十分冷清。与“门庭冷落”同义，但“门可罗雀”更形象（门口可以张网捕雀）。", a: "门可罗雀"},
        {p: "表达对学者勤奋和坚持精神的赞扬。", a: "穷经皓首"},
        {p: "用一个根本性的事理贯穿始终；多形容原则、思想、政策等从头到尾保持一致。", a: "一以贯之"},
        {p: "用同一标准去衡量所有事物。指不加区别、笼统处理。常用否定式：不能一概而论（强调情况不同，需区别对待）。", a: "一概而论"},
        {p: "把性质不同的事物混同起来，当作同样的事物谈论。多用于错误地等同不同性质的事物。", a: "混为一谈"},
        {p: "把不同时间的事物放在同一时间来谈论。比喻相提并论、等量齐观。常用否定式：不可同日而语（强调差距大，不能相比）。", a: "同日而语"},
        {p: "把不同的人或不同的事放在一起谈论或看待。侧重点：强调“把两者放在一起说”", a: "相提并论"},
        {p: "指对有差别的事物，用同等的标准来对待或衡量。强调“用同一标准去衡量不同的事物”", a: "等量齐观"},
        {p: "指对人或事物评头论足，议论是非优劣。也指计较得失、争论高下", a: "衡长论短"},
        {p: "双方各占一半，不分高低。比喻双方势均力敌，不相上下。侧重点：强调“结果对等”，多用于竞争、比赛、比较后得出的结论。", a: "平分秋色"},
        {p: "客人与主人分立在庭院两侧，相对行礼。比喻双方地位平等，可以抗衡。侧重点：强调“地位对等、互不相让”，多用于对抗、竞争、对立的语境。", a: "分庭抗礼"},
        {p: "并排套着的几匹马一齐快跑。比喻地位或程度相当，不相上下。强调“水平相当”。", a: "并驾齐驱"},
        {p: "拨开沙子拣选黄金，比喻从大量事物中精心挑选精华。强调“去粗取精、认真筛选”。", a: "披沙拣金"},
        {p: "对准靶子射箭，比喻说话做事有明确的目的性和针对性。褒义，强调“目标明确、不盲目”。", a: "有的放矢"},
        {p: "指一个人表面上爱好或推崇某种事物，但并非真心，甚至内心排斥。专用于讽刺那些表里不一、言行脱节的人。", a: "叶公好龙"},
        {p: "比喻不合理地迁就现成条件，或生搬硬套，不顾实际。", a: "削足适履"},
        {p: "照着本子念。形容死板地照搬，缺乏创造性。强调“死板照搬”。", a: "照本宣科"},
        {p: "比喻一味模仿别人，不仅没学到本事，反而连自己原有的东西也丢掉了。", a: "邯郸学步"},
        {p: "比喻照着样子模仿，但效果往往不逼真、不到位，技艺不到家。“模仿不到家”", a: "照猫画虎"},
        {p: "丑女效仿美女皱眉。比喻盲目模仿，结果更丑。强调“盲目模仿”。", a: "东施效颦"},
        {p: "形容山峰、道路迂回曲折。常比喻事情经历曲折后，出现新的转机.侧重“过程曲折”,强调“路绕”。", a: "峰回路转"},
        {p: "原指绿柳成荫、繁花似锦的景象，后比喻在困境中看到希望。侧重“绝处逢生”，与“峰回路转”近义，但“柳暗花明”更强调“从暗到明”的情绪转变。", a: "柳暗花明"},
        {p: "比喻用新奇、出乎意料的方法取得胜利。侧重“方法巧妙”。", a: "出奇制胜"},
        {p: "侧重“时间顺序上的因果”（先苦后甜），常用于个人命运或经历。", a: "苦尽甘来"},
        {p: "对古代的事知道很多，又通晓现代的事。形容知识渊博。只用于形容人的学识，不用于形容作品。", a: "博古通今"},
        {p: "震动古代，照亮当今。形容事业 or 功绩极其伟大。多用于形容重大成就或贡献，程度极重。", a: "震古烁今"},
        {p: "形容声势浩大或事件影响巨大。多用于事件本身的影响力。", a: "惊天动地"},
        {p: "全世界的人都注视着。形容影响极大，受到全球关注。", a: "举世瞩目"},
        {p: "语言浅近，但含义深远。指话说得浅显易懂，但蕴含的道理很深刻。适用对象：仅限于言语、文章、讲话，不用于形容其他事物。", a: "言近旨远"},
        {p: "范围宽广（博大） + 内容深刻（精深）。形容思想和学术广博高深。侧重点：广度+深度的结合，既有宽度又有深度。", a: "博大精深"},
        {p: "原指有了洞穴才会进风（事实根据），指消息和传说不是完全没有原因的，即事出有因。它通常表示“有根据的传言”。", a: "空穴来风"},
        {p: "荒诞无稽、没有根据的话。", a: "不经之谈"},
        {p: "只顾按自己的观点说话，不理会别人的意见。也可指“自言自语”。", a: "自说自话"},
        {p: "形容文献、资料、书籍等数量极其繁多，像烟雾笼罩的大海一样望不到边。侧重点：数量多到无法计数。特指书籍、史料、文献、信息等抽象事物。", a: "浩若烟海"},
        {p: "形容事物繁多，丰富多彩，令人目不暇接。侧重点：数量和种类都很多，且带有“蔚为壮观、值得观赏”的意味。易混淆：与“浩若烟海”相比，“洋洋大观”更多用于“展品、项目、成果”等可陈列、可观赏的事物，不限于“文献”。", a: "洋洋大观"},
        {p: "形容人们议论纷纷，众口喧腾，多指公众在背后对某人或某事评头论足", a: "人言籍籍"},
        {p: "相比之下显得暗淡无光。强调“失去光彩”。", a: "黯然失色"},
        {p: "强调“比较后显出不足”，必须有明确的比较对象，且侧重“能力/水平不够”。", a: "相形见绌"},
        {p: "因不如人而感到惭愧。强调“内心惭愧”。", a: "自惭形秽"},
        {p: "稍微差一点。指与对方相比，稍显不足。强调“稍差一点”。", a: "略逊一筹"},
        {p: "一挥笔就完成了。形容写字、写文章、画画等动笔类的创作非常迅速，毫不费力，创作过程十分流畅", a: "一挥而就"},
        {p: "对人或事物进行评价，特指提出肯定或否定意见。“臧否”意为：褒贬、评价", a: "予以臧否"},
        {p: "顺着事物发展的趋势，加以引导，使其向有利的方向发展。褒义，强调“主动引导、化势为利”。", a: "因势利导"},
        {p: "顺应潮流或趋势而行事。强调“顺应趋势”。强调“顺应”。", a: "顺势而为"},
        {p: "观察时机，估量形势。强调“分析形势、把握时机”。强调“分析判断”。", a: "审时度势"},
        {p: "从锅底抽掉柴火。比喻从根本上解决问题，或从源头阻断。褒义，强调“治本、果断”。", a: "釜底抽薪"},
        {p: "比喻说话或做事偏离了正确的方向或标准，脱离常规。适用对象：多用于形容言行、文章、表演等偏离主题或违背常理。", a: "离弦走板"},
        {p: "返回根本，恢复原来的状态。指回到事物的本源或初始状态。侧重点：强调“回归原点、恢复本来面目”，是中性词", a: "返本还原"},
        {p: "原指使美德发扬光大，但现代考试中常考其贬义：形容做事马虎、不细致、不认真，把事情看得很简单，随随便便就应付过去。与“粗枝大叶”近义。", a: "大而化之"},
        {p: "从整体上、全局上观察和把握形势。强调“宏观视野”。", a: "通观大局"},
        {p: "精心细致地雕刻。比喻做事认真细致，精益求精。强调“精细、完美主义”", a: "精雕细琢"},
        {p: "比喻学业或技艺不断进步，每天都向上提升。侧重点：强调“持续的小幅进步”，重在“不松懈、不满足于现状”。", a: "竿头日上"},
        {p: "各自按照自己认为对的去做。比喻思想不统一，行动不一致，各搞一套。“缺乏全局观念，一盘散沙”", a: "各行其是"},
        {p: "羊丢了就修补羊圈。比喻出了差错后及时补救，还不算晚。强调“事后补救”，鼓励补救行为。", a: "亡羊补牢"},
        {p: "把烟囱改弯，把柴草搬走。比喻事先采取措施，防止灾祸发生。强调“事前预防”", a: "曲突徙薪"},
        {p: "比喻先下手为强，主动采取行动，以争取主动权。多用于军事、体育、商业、博弈等需要“抢时间”的领域", a: "先发制人"},
        {p: "天没下雨时，就修缮门窗。比喻事先做好准备。", a: "未雨绸缪"},
        {p: "惩罚之前的错误，警惕以后不再犯。强调“从过去的错误中吸取教训”", a: "惩前毖后"},
        {p: "纠正偏差，补救弊端。强调“纠正错误、补救问题”", a: "补偏救弊"},
        {p: "冲破云层，突破迷雾。比喻突破重重困难或障碍，看清真相、达到目标。侧重点：强调“突破阻碍、扫清障碍”，带有奋进、果敢的色彩。", a: "冲云破雾"},
        {p: "平静的月影映在水底，好似沉 in 水中的一块玉璧。侧重点：纯粹描写月夜水景，形容湖面平静、月影皎洁的美好景象。仅限于描写水边月夜的景色，不能用于形容人、事业、精神等。", a: "静影沉璧"},
        {p: "不按寻常的等级次序，越级提拔，即破格晋升。", a: "不次之迁"},
        {p: "指把升官发财当作阶梯来攀爬，即通过钻营、巴结等手段追求升官发财。", a: "梯荣阶禄"},
        {p: "形容虚心接受批评意见，勇于改正错误，多用于面对批评和意见时的态度", a: "闻过则喜"},
        {p: "形容能很快地接受别人好的意见或建议。", a: "从善如流"},
        {p: "比喻事情轻而易举，一下子就能完成", a: "一蹴而就"},
        {p: "比喻只改变形式，不改变内容，或指形式上变了，实质上依然如故", a: "改头换面"},
        {p: "指某种事物逐渐发展、盛行，形成一种良好的风气或习惯", a: "蔚然成风"},
        {p: "比喻两手轮流做同一动作，或左右两边同时进行。也指多方面同时展开工作", a: "左右开弓"},
        {p: "比喻在前进的道路上精神振奋、斗志昂扬，且进展迅速", a: "高歌猛进"},
        {p: "比喻残存的珍贵文物、艺术珍品或精华片段。指极其稀少、非常珍贵的遗存。", a: "吉光片羽"},
        {p: "形容数量极其微小、程度极其轻微，几乎可以忽略不计", a: "微乎其微"},
        {p: "形容精神振奋、斗志昂扬、气势磅礴。也指愤怒或豪情达到极点", a: "气冲霄汉"},
        {p: "求证过程严格、周密。强调“治学态度严谨”。", a: "求证严谨"},
        {p: "考辨指考证辨析，再创新。强调“在考证基础上创新”。", a: "考辨创新"},
        {p: "广泛引用各种材料作为依据。强调“引用广博”。", a: "旁征博引"},
        {p: "见闻广博，能言善辩。强调“博闻+口才好”。用于形容人", a: "博闻辩言"},
        {p: "不能改动或不可磨灭的言论。比喻正确、经典的论断。", a: "不刊之论"},
        {p: "善于辩论，连缀辞句。强调“写作/论辩的文采和逻辑”。", a: "辩说属辞"},
        {p: "才学浅薄（多用于自谦）。强调“才疏学浅”", a: "诠才末学"},
        {p: "承受不了那些烦琐的事情。指烦琐之事多到让人受不了。", a: "不胜其烦"},
        {p: "不嫌烦琐。指耐心细致，不怕麻烦。侧重点：强调“有耐心”，侧重“态度好、不怕重复”。", a: "不厌其烦"},
        {p: "极力搜刮钱财，没有满足的时候。指贪得无厌地搜刮民财。强调“贪财、搜刮”，指对钱财的贪婪无度。", a: "聚敛无厌"},
        {p: "精神振奋，斗志昂扬，奋发向前。强调“精神振作、奋发有为”，侧重个体或群体的昂扬斗志。", a: "踔厉奋发"},
        {p: "齐心上进，合力同心。指大家齐心协力，团结一致。强调“齐心协力、团结合作”，侧重集体行动的一致性。“勠力同心”更书面化，常用于宏大叙事。", a: "勠力同心"},
        {p: "同乘一条船，一起渡河。比喻在困难时期团结互助，共同克服困难。强调“共渡难关”，侧重面对困境时的团结协作。", a: "同舟共济"},
        {p: "比喻众人团结一致，就能形成强大的力量，战胜一切困难。", a: "众志成城"},
        {p: "团结一致，奋发前进。强调“团结+奋进”，是最直白的“团结奋斗”表达。最口语化、最直白的一个，常用于口号、标语。", a: "团结奋进"},
        {p: "形容全部做错，毫无可取之处。指对人或事物的全盘否定", a: "百无一是"},
        {p: "枝叶强盛，树根衰弱。比喻次要力量强大，主要力量虚弱，本末倒置。侧重“主弱次强、结构失衡”", a: "强枝弱本"},
        {p: "尾巴太大，掉转不灵。比喻势力强大，难以指挥调度。侧重“下强上弱、难以控制”", a: "尾大不掉"},
        {p: "树根强盛，枝叶削弱.比喻加强根本，削弱次要力量。侧重“固本强基、主次分明”", a: "强本弱枝"},
        {p: "枝条依附于树干，叶子附着于枝条。比喻关系紧密、依附顺从。侧重“紧密依附、从属关系”", a: "枝附叶著"},
        {p: "比喻从根源上彻底解决问题或纠正错误，从根本上进行整治、改革", a: "正本清源"},
        {p: "形容突然遇到意想不到的喜事，令人高兴", a: "喜从天降"},
        {p: "比喻在不良事物萌芽阶段就及时制止，不让它发展蔓延。多用于廉政建设、安全生产、疾病预防、思想教育等需要“抓早抓小”的领域", a: "防微杜渐"},
        {p: "比喻把自己的困难、灾祸或责任转嫁给别人，即损人利己、嫁祸于人。多用于国际关系、经济政策、环境保护等语境，指将自身问题转嫁给他方", a: "以邻为壑"},
        {p: "用不上力量，指没有能力去做或无法解决问题。强调“彻底没有能力”，是对能力的直接否定。", a: "无能为力"},
        {p: "拉一下衣襟，胳膊肘就露出来了。形容衣服破烂。比喻生活穷困或做事顾此失彼，穷于应付。强调“资源不足、应接不暇”，侧重“处境窘迫、难以周全”。", a: "捉襟见肘"},
        {p: "比喻力量不足，应付了这边，那边又出了问题。指穷于应付、处境窘迫，多指具体的几件事", a: "左支右绌"},
        {p: "指跟另一个人或事物比较起来，显得远远不如。", a: "相形见绌"},
        {p: "心里想做，但能力不够。强调“主观意愿与客观能力的矛盾”，侧重“想做但做不到”的无奈感。", a: "力不从心"},
        {p: "像踩在薄冰上一样。比喻行事极为谨慎、小心翼翼，生怕出错。中性（取决于语境）。它既可以表示因畏惧而谨慎（如身处险境），也可以表示因重视而谨慎（如对待重要工作）", a: "如履薄冰"},
        {p: "好像站在深渊的边缘。比喻行事极为谨慎警惕。强调“警惕、谨慎”。", a: "如临深渊"},
        {p: "用于批评做事不果断、顾虑过多。多用于形容决策、行动时因顾虑太多而犹豫不决", a: "瞻前顾后"},
        {p: "独自开辟一条新路。侧重独创一种新方法、新风格", a: "独辟蹊径"},
        {p: "单独树立一面旗帜，侧重自成一家、风格独特", a: "独树一帜"},
        {p: "独创一格，与众不同。指构思巧妙，有独特的创意。强调“构思巧妙、独创”。", a: "别出心裁"},
        {p: "独自想出新颖的办法。指构思巧妙、有独创性。强调“独创构思”。", a: "独出心裁"},
        {p: "比喻做事舍近就远，多走弯路，不切实际。也指舍弃容易的，去追求困难的。多用于形容决策、办事、学习方法等，指因方法不当而多费周折", a: "舍近求远"},
        {p: "推究事物的原理，穷尽其中的道理。是中国古代哲学的核心概念，指通过探究万物来获得知识、明白道理。强调“探究事物背后的根本原理”，有哲学和学术深度。", a: "格物穷理"},
        {p: "追究根源，查问底细。指把事情的来龙脉彻底查清楚。强调“深入挖掘、打破砂锅问到底”的探究精神。", a: "追根究底"},
        {p: "像蜻蜓在水面上轻轻一点。比喻做事肤浅、不深入。", a: "蜻蜓点水"},
        {p: "比喻事物本身所应当包含的道理或内容。指按照常理或规律，本来就该如此。常用于政策、制度、理论、责任等语境，强调其正当性和必然性", a: "题中之义"},
        {p: "比喻个人的力量单薄，难以独自承担重任或支撑局面。可用于客观描述个人力量有限，也可用于批评某人自不量力。多用于形容个人能力有限，需要团队协作", a: "独木难支"},
        {p: "喻力量达不到，或距离太远而无法顾及、控制。多用于形容因距离远或权力范围有限，无法干预或控制", a: "鞭长莫及"},
        {p: "指能力不够，无法胜任或完成某件事。多用于自谦或客观陈述能力有限，“逮”指达到，及", a: "力有不逮"},
        {p: "国内大循环为主体、国内国际双循环相互促进的新发展格局。2020年中央提出，旨在应对国际环境变化，推动中国经济高质量发展。", a: "双循环"},
        {p: "以国内供给和需求为主体的循环。核心是扩大内需、提升自主创新能力、打通国内生产—分配—流通—消费各环节。", a: "国内大循环（内循环）"},
        {p: "以国际贸易和跨境投资为主体的循环。核心是维持对外开放、提升国际竞争力。", a: "国际大循环（外循环）"},
        {p: "从高屋顶上倒水，水顺势往下流。比喻从高处俯瞰全局，具有远见和战略高度。强调“视野高远、全局观强”，侧重战略高度和宏观把握。", a: "高屋建瓴"},
        {p: "提起渔网的总绳（纲），所有的网眼（目）就都张开了。比喻抓住关键环节，带动其他环节。强调“抓主要矛盾、以点带面”，侧重关键引领和系统效应。", a: "纲举目张"},
        {p: "提起渔网的总绳，拎起衣服的领子。比喻抓住关键、抓住要领。强调“抓住要领”。", a: "提纲挈领"},
        {p: "形容地域辽阔，无边无际。强调“面积大、无边”。", a: "广袤无垠"},
        {p: "像山一样高，像水一样长。比喻情谊深厚或品格高洁，流芳久远。强调“情谊/品德”，不指地理。", a: "山高水长"},
        {p: "像大海一样广阔，像天空一样无边。形容空间广阔，也比喻心胸开阔或话题不受限制。", a: "海阔天空"},
        {p: "天高远，地辽阔。形容空间开阔。强调“视野开阔、天地宽广”。", a: "天高地阔"},
        {p: "接连不断地出现，没有穷尽。强调“连续不断、数量多”。", a: "层出不穷"},
        {p: "大量地、充分地积蓄，少量地、慢慢地放出。比喻只有准备充分，才能把事情做好。强调“长期积累、适时爆发”。", a: "厚积薄发"},
        {p: "到处都开花。比喻好的事物到处涌现、普遍发展。强调“广泛兴起、普遍出现”。", a: "遍地开花"},
        {p: "内心非常向往。指对某人或某事物有着强烈的向往和追求。强调“向往、仰慕”。", a: "心向往之"},
        {p: "心神不定，思绪起伏。比喻内心受到强烈震动或诱惑。强调“心神不宁、波动”。", a: "心旌摇荡"},
        {p: "心神飞到（向往的地方）。形容内心非常向往，渴望不已。强调“渴望、向往”。", a: "心驰神往"},
        {p: "心情舒畅，精神愉快。指心境开阔，精神愉悦。强调“心情舒畅、精神愉悦”。", a: "心旷神怡"},
        {p: "适宜于草木生长的和风细雨。比喻良好的教育和熏陶。强调“教育感化”。", a: "春风化雨"},
        {p: "经历长久的时间，反而更加鲜活。指事物越久越有生命力。强调“时间越久越有价值”。强调旧的东西在现代仍然有价值（时间上的提示）", a: "历久弥新"},
        {p: "经过很长时间也不衰退。指持续保持兴盛。强调“持久兴盛”。", a: "经久不衰"},
        {p: "在锦缎上再绣花。比喻好上加好，使美好的事物更加美好。强调“在已有的好基础上更好”，侧重“增色、添彩”。", a: "锦上添花"},
        {p: "好了还要求更好。指在已经很好的基础上，追求更加精良、更加完美。强调“追求卓越、永无止境”，侧重“品质的不断提升”。要提到已经很好的情况下追求更好", a: "精益求精"},
        {p: "反复锤打、多次冶炼。比喻经历多次艰苦的锻炼和考验。也指对文章、作品反复推敲修改。强调“反复打磨、经受考验”的过程。", a: "千锤百炼"},
        {p: "精心细致地雕刻。比喻做事认真细致，精益求精。多用于艺术创作、工艺制作。强调“细致、用心”，侧重“工艺层面的精细”。", a: "精雕细琢"},
        {p: "曹操率军行军途中，士兵口渴，他谎称前方有梅林，士兵因想象酸梅而流口水止渴。比喻用空想或假象安慰自己。", a: "望梅止渴"},
        {p: "比喻方向、方法根本错误，不可能达到目的，侧重方法不对，必然失败", a: "缘木求鱼"},
        {p: "上山采珍珠。比喻方向方法错误。强调“方向错误”。", a: "升山采珠"},
        {p: "喝毒酒解渴。比喻用错误的办法解决眼前的困难，不顾严重后果。强调“只顾眼前，不顾后果”。", a: "饮鸩止渴"},
        {p: "抱着柴草去救火。比喻方法不当，反而使灾祸扩大。强调“方法错误反加重”。", a: "抱薪救火"},
        {p: "抽干水塘去捉鱼。比喻只顾眼前利益，不顾长远发展。强调“短视、破坏性取利”。多用于只顾发展经济，不顾生态环境的破坏", a: "竭泽而渔"},
        {p: "杀了鸡取出蛋。比喻只顾眼前利益，不顾长远发展。强调“只顾眼前”。", a: "杀鸡取卵"},
        {p: "在地上画个圈当牢房，比喻只许在指定范围内活动，自己限制自己。贬义侧重“自我划定界限，不愿逾越”。", a: "画地为牢"},
        {p: "比喻拘泥成例，不懂变通，办事刻板，不知随情况变化而变化。强调“僵化、不知变通”", a: "刻舟求剑"},
        {p: "比喻因循守旧，固执地按老规矩办事，不肯改变。用于批评思想僵化、拒绝创新的态度或行为。", a: "墨守成规"},
        {p: "拘泥于古人的说法，不知变通。指死守旧法，不结合实际。强调“拘泥古法”。", a: "泥古不化"},
        {p: "学了古代知识却不能灵活运用。指拘泥于旧法，不知变通。强调“拘泥古法”。", a: "食古不化"},
        {p: "陈谷堆叠，后谷继续堆积。比喻沿袭旧的一套，没有创新。强调“内容上的重复、没有新意”，侧重“因袭守旧、缺乏创新”。", a: "陈陈相因"},
        {p: "安于现状，不求进步。比喻守着老一套，不求革新。强调“保守自满”。", a: "固步自封"},
        {p: "比喻安于现状，不求进步，把自己限制在旧框框里。保守自满，拒绝革新。强调“守旧”。侧重自满而不进取。", a: "故步自封"},
        {p: "守着残缺的东西不放。指保守、不愿接受新事物。强调“固守残缺”。", a: "抱残守缺"},
        {p: "充分展示自己的才能。指有机会施展本领。强调“施展才华、大有作为”", a: "大展拳脚"},
        {p: "比喻经济困难，入不敷出，提前透支未来的收入或资源。也指不顾长远，只顾眼前", a: "寅吃卯粮"},
        {p: "因为吃饭噎住了，就再也不吃饭。比喻因为怕出问题，就索性不干了。强调“因怕犯错而放弃”。", a: "因噎废食"},
        {p: "比喻不知怎么办才好，不知该听从谁的。多指面对多种意见或选择时，陷入困惑", a: "无所适从"},
        {p: "不允许有任何怀疑。指事实确凿、理由充分，不容怀疑。强调“确定性、可靠性”，侧重“不可怀疑”。", a: "不容置疑"},
        {p: "顺着条理，自然成章。比喻写文章或做事顺着逻辑，自然成文。也指某种情况合乎情理，自然产生。强调“合乎逻辑、自然而然”，侧重“因果自然”。", a: "顺理成章"},
        {p: "水流到的地方，自然形成水渠。比喻条件成熟了，事情自然会成功。强调“条件成熟、自然而然成功”，侧重“瓜熟蒂落”。", a: "水到渠成"},
        {p: "瓜熟了，瓜蒂自然脱落。比喻条件成熟，事情自然成功。强调“自然成熟”。", a: "瓜熟蒂落"},
        {p: "指事物本身所应当包含的、合乎情理的内容或道理.强调“按照常理或规律，本来就该如此”", a: "应有之义"},
        {p: "形容非常公平合理。多用于质疑不公。强调“公平、正当”。", a: "天公地道"},
        {p: "按道理应当如此。指从情理上说，应当这样。强调“情理上应当”，侧重“应该、本应如此”。", a: "理所当然"},
        {p: "指绝对正确、不容置疑的道理或事情。强调“理所当然，无需讨论”", a: "天经地义"},
        {p: "形容破坏严重，到处都是破洞和伤痕。比喻弊病很多、问题严重。强调“问题多、破败”。", a: "千疮百孔"},
        {p: "形容色彩鲜艳，式样繁多。", a: "五光十色"},
        {p: "形容色彩丰富、灿烂多彩。", a: "五彩斑斓"},
        {p: "用委婉含蓄的方式批评一件事（或一个人），却能起到警戒、劝勉一百件事（或一百个人）的效果。即批评一个，教育一片。仅限于文艺作品、文学批评、言论。多用委婉、含蓄的讽刺手法。", a: "讽一劝百"},
        {p: "针对社会上的弊病、错误进行尖锐的批评和指正。多用直接、尖锐的批评笔调。", a: "针砭时弊"},
        {p: "指对犯了错误的人严加惩处，以警告其他人不要效仿", a: "以儆效尤"},
        {p: "形容四处奔走、奔波忙碌。", a: "东奔西走"},
        {p: "形容诗歌描写生动，如同一幅画。特指王维的诗歌风格。", a: "诗中有画"},
        {p: "形容房屋高大华丽。", a: "美轮美奂"},
        {p: "像诗歌和绘画一样优美。形容富有诗意和美感。", a: "诗情画意"},
        {p: "急于求成，贪图眼前利益。指做事只顾眼前，不顾长远。", a: "急功近利"},
        {p: "不切实际地追求过高、过远的目标。指脱离实际，眼高手低。", a: "好高骛远"},
        {p: "拔高禾苗帮助它生长。比喻违反事物发展规律，急于求成，反而坏事。", a: "揠苗助长"},
        {p: "原指八股文的第一股，后泛指文章的开头。也比喻事情的开端。", a: "破题"},
        {p: "原指打破坚冰，后比喻打破僵局、消除隔阂。也指初步打开局面。", a: "破冰"},
        {p: "言辞不能准确地表达意思。指说话写文章表达不清。强调“表达不到位”。", a: "词不达意"},
        {p: "比喻行动与目的完全相反。指方向错了，越努力离目标越远", a: "南辕北辙"},
        {p: "相互背离，向相反的方向走。指彼此方向相反。强调“方向相反”。", a: "相背而行"},
        {p: "两者方向完全相反。指彼此对立。强调“两者相反”。", a: "背道而驰"},
        {p: "因沿袭而成为习惯。指某种做法或习俗经过长期延续，逐渐变成了惯例。强调“长期沿袭、自然形成”的过程。侧重“成为习惯”的结果。", a: "相沿成习"},
        {p: "按照一定的步骤、顺序进行。原指写文章时按照布局、层次来安排内容。强调“遵循步骤和程序”，侧重“有序推进、不越级”。", a: "按部就班"},
        {p: "遵守规矩，不越雷池。原指遵守礼法，后多形容拘泥于旧规矩，不敢创新。强调“严格遵守规矩”，侧重“行为上的保守、刻板”。", a: "循规蹈矩"},
        {p: "经过长期约定而成为惯例。指某种事物或做法经过长期实践，被大家共同认可，成为一种习惯。强调“大家共同认可、自然形成”,侧重“社会公认的惯例”。", a: "约定俗成"},
        {p: "形容精彩的事物纷纷呈现，丰富多彩。强调“丰富精彩”。", a: "异彩纷呈"},
        {p: "比喻各种不同形式、风格的艺术自由发展。也指各行各业蓬勃发展。", a: "百花齐放"},
        {p: "像鸭子一样成群地跑过去。比喻很多人争相追逐（不好的事物）。强调“争相追逐”。", a: "趋之若鹜"},
        {p: "饶有兴致地谈论。指对某事很感兴趣，不停地谈论。强调“津津有味地谈论”。", a: "津津乐道"},
        {p: "乐于做某件事，不觉得疲倦。指对某事有浓厚兴趣，乐在其中。", a: "乐此不疲"},
        {p: "捡取别人说过的话。指抄袭或套用别人的言论。强调“抄袭、无创见”。", a: "拾人牙慧"},
        {p: "永远不说失败。形容意志坚强，绝不认输.强调“不服输”。", a: "永不言败"},
        {p: "无论受多少挫折都不退缩。形容意志坚强，顽强不屈。强调“屡挫屡奋”。", a: "百折不挠"},
        {p: "即使死多次也不后悔。形容意志极其坚定，至死不渝。强调“至死不悔”。", a: "九死不悔"},
        {p: "指赞叹所见事物好到极点。形容所看到的事物精美绝伦，令人赞叹不已", a: "叹为观止"},
        {p: "原指统一全国，后泛指统一全局或在某一领域占据绝对主导地位。强调“统一、绝对主导”。", a: "一统天下"},
        {p: "某种观点、主张、风气或事物广泛流行、盛行一时。", a: "大行其道"},
        {p: "形容某种事物在某个时期极其流行，像风吹倒草木一样。强调“短时间流行”。", a: "风靡一时"},
        {p: "比喻检验事物真伪或价值的可靠标准。强调“检验标准”。", a: "试金石"},
        {p: "比喻借以求得名利的初步手段，一旦达到目的即可抛弃。强调“临时利用的工具”。", a: "敲门砖"},
        {p: "比喻关键时刻克敌制胜的绝招。指最有把握、最厉害的手段。强调“制胜绝招”。", a: "杀手锏"},
        {p: "很难做到的事情竟然做到了，所以值得宝贵。强调“因为难得而可贵”。", a: "难能可贵"},
        {p: "形容凶猛而使人害怕的波涛。比喻险恶的环境或尖锐的斗争。强调“险恶、动荡”。", a: "惊涛骇浪"},
        {p: "比喻众多竞争者同时行动，奋勇争先的繁荣局面。", a: "千帆竞发"},
        {p: "众多船只争相行驶。比喻众多竞争者奋勇争先、竞相发展的局面。强调“竞争激烈、奋发争先”。", a: "百舸争流"},
        {p: "脚被缠住，不能前进。比喻因害怕而不敢前进。强调“因怕而退缩”。", a: "裹足不前"},
        {p: "什么都不放在眼里。形容骄傲自大，看不起一切。强调“狂妄自大”。", a: "目空一切"},
        {p: "快乐得不想回蜀国。比喻乐而忘返，不思故土。强调“沉溺快乐而忘本”。", a: "乐不思蜀"},
        {p: "在庭院里悠闲地散步。形容从容不迫、悠闲自得。强调“从容、悠闲”。是一种状态", a: "闲庭信步"},
        {p: "来来往往像织布梭子一样。形容频繁地来往、忙碌不停。强调“频繁往来、忙碌”。", a: "往来穿梭"},
        {p: "沉迷于某处而忘记返回。形容被美好事物吸引，舍不得离开。强调“被吸引而忘归”。", a: "流连忘返"},
        {p: "呼吸相关联，比喻关系极为密切。强调“相互关联、彼此影响”，适用范围最广。", a: "息息相关"},
        {p: "千丝，万根线。比喻彼此之间关系复杂、联系密切。强调“联系复杂繁多、牵连深”，比“息息相关”更强调“多而密”。", a: "千丝万缕"},
        {p: "感情深厚，舍不得分离。强调“人的情感上的不舍”，多用于人际关系。", a: "难舍难分"},
        {p: "水和乳汁融合在一起。比喻关系非常融洽，结合紧密。强调“融为一体、和谐无间”，侧重于“融合的深度”。", a: "水乳交融"},
        {p: "按照身材剪裁衣服。比喻根据实际情况办事。强调“因地制宜、因事制宜”。", a: "量体裁衣"},
        {p: "抽丝，剥茧。比喻层层深入地分析、理清头绪。强调“逐步深入、细致分析”。", a: "抽丝剥茧"},
        {p: "比喻事业蓬勃发展、场面热烈活跃、人或社会充满生机与活力。“龙腾虎跃的干劲”", a: "龙腾虎跃"},
        {p: "成千上万匹马奔跑。形容声势浩大、气势雄壮。“激发万马奔腾的活力”", a: "万马奔腾"},
        {p: "可以纵马奔驰的广阔平地。比喻地势平坦、进展顺利。强调“平坦顺利”。", a: "一马平川"},
        {p: "精神振奋，气概昂扬。形容精神饱满、斗志昂扬。强调“精神状态”。", a: "意气风发"},
        {p: "鼓起勇气，冲到最前面。形容勇敢地冲在前头。强调“勇敢、争先”。", a: "奋勇当先"},
        {p: "草木茂盛，生机勃勃。比喻事业蓬勃发展，繁荣兴旺。强调“繁荣、兴旺”。", a: "欣欣向荣"},
        {p: "时间不会等待我们。比喻时间紧迫，要抓紧行动。强调“抓紧时机”。", a: "时不我待"},
        {p: "比喻从小处看到大处，从细节推断全局。指有敏锐的洞察力，能够通过细微迹象判断事物的发展变化。", a: "见微知著"},
        {p: "指事情发生的结果超出了最初的预料，即没想到、没料到。", a: "始料不及"},
        {p: "在磨炼中奋勇前进。“砥砺”指磨刀石，引申为磨炼、锻炼。指在困难和考验中不断磨砺自己，坚定前行。强调“经受磨炼、不断成长”，侧重于过程。", a: "砥砺前行"},
        {p: "继承前人的事业，开辟未来的道路。指承前启后、承上启下。强调“传承与创新”，侧重于时间上的衔接。", a: "继往开来"},
        {p: "一直向前，无所阻挡。形容勇猛无畏、不惧艰险。强调“勇猛、不退缩”，侧重于决心和勇气。", a: "一往无前"},
        {p: "在风雨中仍然不停地赶路。比喻不避艰难，勇往直前。强调“不惧困难、坚持赶路”，侧重于在逆境中坚持。", a: "风雨兼程"},
        {p: "最先受到冲击或攻击。指处于最先受影响的位置。强调“最先受影响”。", a: "首当其冲"},
        {p: "自己不出力，却享受别人的劳动成果。强调“享受成果”，侧重“不劳而获”。", a: "坐享其成"},
        {p: "利用别人之间的矛盾，从中获取利益。来源于“鹬蚌相争，渔翁得利”。强调“利用他人争斗获利”，侧重“借机取利”。", a: "坐收渔利"},
        {p: "养精蓄锐，等待疲劳的敌人来犯时予以迎击。指作战时采取守势，趁敌人疲惫时出击。强调“以静制动、后发制人”，是军事/竞争策略。", a: "以逸待劳"},
        {p: "在浑浊的水中摸鱼。比喻趁混乱的时机捞取不正当的利益。强调“趁乱取利”，必须有混乱的局势。", a: "浑水摸鱼"},
        {p: "守在树桩旁等兔子撞上来。比喻不主动努力，存有侥幸心理，希望得到意外收获。强调“侥幸等待”，侧重“不主动、寄希望于运气”。", a: "守株待兔"},
        {p: "用一个人（或一份财物）来供养一百个人。比喻生产的人少，消费的人多，入不敷出。强调“供养比例失衡”，侧重“负担重、入不敷出”。", a: "以一奉百"},
        {p: "拿鱼眼睛冒充珍珠。比喻用假的冒充真的，以次好。强调“以假乱真”。", a: "鱼目混珠"},
        {p: "不顾质量，大量制作。指制作马虎，质量低劣。强调“质量差、不精细”。", a: "粗制滥造"},
        {p: "昙花开花时间很短。比喻事物出现不久就消失了。强调“短暂出现”。", a: "昙花一现"},
        {p: "稍微一放松就消失了。形容时间或机会极易流逝.强调“易逝、短暂”。", a: "稍纵即逝"},
        {p: "任意糟蹋东西。指不珍惜财物，浪费严重。强调“浪费、糟蹋”。", a: "暴殄天物"},
        {p: "放弃根本，追求枝节。指抓了次要的，丢了主要的。强调“主次不分”、“选择错误”。", a: "舍本逐末"},
        {p: "把根本的和枝节的颠倒。指主次颠倒，轻重不分。强调“位置颠倒”", a: "本末倒置"},
        {p: "买了盒子退还珍珠。比喻取舍不当。强调“主次不分”。", a: "买椟还珠"},
        {p: "把重要的和不重要的颠倒。指主次不分。强调“主次颠倒”。", a: "轻重倒置"},
        {p: "客人的声音压倒了主人的声音。比喻次要的压倒了主要的。强调“主次颠倒”。", a: "喧宾夺主"},
        {p: "多方面同时前进。指不分先后，同时进行。强调“同步前进”。", a: "齐头并进"},
        {p: "两支笔同时作画.比喻同时采用两种方法。强调“两种方法并用”。", a: "双管齐下"},
        {p: "同时进行，互不冲突。指可以共存、兼容。强调“兼容不矛盾”。", a: "并行不悖"},
        {p: "左右手都能射箭。比喻两方面同时进行。强调“同时兼顾两边”。", a: "左右开弓"},
        {p: "连续不断，延续很长。强调“时间/空间上的连续性”。", a: "绵延不绝"},
        {p: "源头远，水流长。强调“历史悠久、根底深厚”。", a: "源远流长"},
        {p: "形态多样，色彩丰富。强调“内容/形式丰富精彩”。", a: "多姿多彩"},
        {p: "形态各异，姿态万千。强调“形态多样”。", a: "千姿百态"},
        {p: "根据不同时期的情况，采取适当的措施。强调“因地制宜、顺势而为”。", a: "因时制宜"},
        {p: "学习、思考、实践、领悟四个环节的有机统一。指在学习过程中，不仅要学，还要思考，更要在实践中去感悟和验证。侧重点：强调“学与思结合、知与行统一”的递进式学习过程。常见语境：多用于党员干部教育、理论学习、主题教育等场景。", a: "学思践悟"},
        {p: "仔细对照（标准/榜样），切实地践行、落实。侧重点：强调“对照反思”和“坚定执行”两个动作。其中“照”是反观自身，“行”是付诸行动。多用于自我反省、对标先进、落实政策等场景。", a: "细照笃行"},
        {p: "认识与实践相统一。侧重点：强调“知”与“行”的统一性，是中国传统哲学的核心命题。广泛应用于教育、修养、工作方法等场景。", a: "知行合一"},
        {p: "依靠在别人的门墙旁边。比喻依附于他人，不能独立自主。", a: "傍人门户"},
        {p: "把毫无关联的事物硬拉在一起，做出牵强的解释。指生拉硬扯、曲解原意。多用于对经典、理论、史实的错误解读。", a: "穿凿附会"},
        {p: "多用于形容学术、艺术、策略等方面缺乏创新，只会模仿他人", a: "亦步亦趋"},
        {p: "比喻受欢迎的人或事物.指备受追捧、抢手。强调“抢手、受欢迎”。", a: "香饽饽"},
        {p: "指示风向的标杆。比喻某种趋势或变化的先兆。强调“指示方向”。", a: "风向标"},
        {p: "站在潮头搏击风浪的人。比喻敢于创新、走在时代前列的人。强调“勇于创新、引领潮流”。", a: "弄潮儿"},
        {p: "舞台上的强光。比喻公众关注的焦点。强调“关注焦点”。", a: "聚光灯"},
        {p: "吸收、获取。指从外界吸收营养或信息。强调“吸收、纳入”", a: "摄取"},
        {p: "从总体中取出。指有选择地取出。强调“取出、分离”。", a: "提取"},
        {p: "吸取、吸收。多用于抽象事物。强调“吸取、借鉴”。", a: "汲取"},
        {p: "用化学方法提取。比喻提取精华。强调“提取精华”。", a: "萃取"},
        {p: "把人力、物力、财力、编制等资源，从上级机关或城市向基层一线、社区、农村倾斜。", a: "下沉"},
        {p: "严格地遵守、固守。指认真、谨慎地遵守。强调“严格、不违背”。", a: "恪守"},
        {p: "遵照、服从。指按照指示或要求去做。强调“服从、依从”。", a: "遵从"},
        {p: "磨炼、修炼。指在困难中磨砺锻炼。强调“磨炼、锻炼”。", a: "砥砺"},
        {p: "天上的白云一会儿像白衣，一会儿像黑狗。比喻世事变化无常。强调“变幻莫测、难以捉摸”。", a: "白云苍狗"},
        {p: "北斗星转动，星星移位。比喻时间流逝或季节更替。强调“时间推移”。", a: "斗转星移"},
        {p: "天翻过来，地覆过去。形容变化巨大而彻底。强调“变化剧烈、彻底”。", a: "翻天覆地"},
        {p: "大海变成桑田，桑田变成大海。比喻世事变化巨大。强调“世事变迁”、“长时间的演变”。", a: "沧海桑田"},
        {p: "水流直下，奔腾千里。形容水势宏大，也比喻文笔奔放或形势发展迅速。强调“水势大、速度快”。", a: "一泻千里"},
        {p: "形容文思或做事气势大，放得开收得拢。多指文章气势磅礴、收放自如。强调“气势恢宏、收放自如”。", a: "大开大合"},
        {p: "没有靶子乱射箭。比喻说话做事没有明确目标，不切实际。强调“没有目标、盲目”。", a: "无的放矢"},
        {p: "起伏变化大。指事物发展不平稳，忽高忽低。强调“波动剧烈”。", a: "大起大落"},
        {p: "盲人摸象。比喻看问题片面，以偏概全。强调“认识片面”。", a: "瞎子摸象"},
        {p: "早上侍奉秦国，晚上侍奉楚国。比喻反复无常，没有原则。强调“反复无常”。", a: "朝秦暮楚"},
        {p: "很多人一下子涌上去。形容缺乏计划，盲目跟风。强调“盲目跟风、扎堆”。", a: "一哄而上"},
        {p: "形容很多人一下子围上去。常指做事缺乏计划、盲目跟风。在“扎堆、蜂拥、不理智”的行为。在言语题中常用来描述一窝蜂投资、一窝蜂去做一个新科技等。例句：看到新风口，投资者一拥而上，极易催生泡沫。", a: "一拥而上"},
        {p: "睡在柴草上，尝苦胆。比喻刻苦自励，发愤图强。强调“刻苦、发愤”。多用于复仇、复兴的语境。", a: "卧薪尝胆"},
        {p: "驾着柴车，穿着破衣。形容创业的艰苦。强调“艰辛创业”。多形容一个行业的创始者（从无到有），比如：一代代航天人。语境使用需要体现出“艰苦”、“开拓”", a: "筚路蓝缕"},
        {p: "山峦重叠，水流回环。比喻前进道路上的重重阻碍。强调“困难重重”。", a: "山重水复"},
        {p: "稳当而有把握地逐步推进。指踏实、有步骤地行动。强调“稳妥、有步骤”。", a: "稳扎稳打"},
        {p: "小心谨慎，认真负责。指做事勤奋、踏实。强调“认真、谨慎”。", a: "兢兢业业"},
        {p: "费尽心血。形容为事业或创作付出极大精力。强调“付出巨大心血”。", a: "呕心沥血"},
        {p: "费尽心思，达到别人达不到的境地。形容刻苦钻研，独到精深。强调“钻研深、成就高”。", a: "苦心孤诣"},
        {p: "每前进一步都设下营垒。比喻行动谨慎，稳扎稳打。强调“稳妥推进”。", a: "步步为营"},
        {p: "故意玩弄花招，使人捉摸不透。指故作高深，掩盖真相。强调“故意让人看不透”。", a: "故弄玄虚"},
        {p: "陈旧、空泛的言辞。指内容重复、毫无新意的老一套言论。强调“言论陈旧、无新意”。", a: "陈词滥调"},
        {p: "故意装出一种腔调和姿态。指故意做作、不真实。强调“故意做作”。", a: "装腔作势"},
        {p: "没病也呻吟。比喻没有真情实感而故意做作。强调“矫情、不真实”。", a: "无病呻吟"},
        {p: "说的话不是发自内心。指心口不一。强调“心口不一”。", a: "言不由衷"},
        {p: "表面上庄严体面。形容表面上正派，实际上并非如此。强调“表面堂皇”。", a: "冠冕堂皇"},
        {p: "清清楚楚地呈现在眼前。指过去的景象或事物清晰地浮现在眼前。强调“清晰、具体”。", a: "历历在目"},
        {p: "怎么赶也赶不走。形容印象或情绪深深留在心中，难以消除。强调“难以消除、长久留存”。", a: "挥之不去"},
        {p: "不寒冷也发抖。形容极度恐惧。强调“恐惧”。", a: "不寒而栗"},
        {p: "记忆还像新的一样。指过去的事情仍记得很清楚。强调“记得清楚”。", a: "记忆犹新"},
        {p: "年纪越大，志气越壮。指人老心不老，精神饱满。强调“年龄大但志气盛”。", a: "老当益壮"},
        {p: "单独树立一面旗帜。比喻自成一家，风格独特。强调“独特、自成体系”。", a: "独树一帜"},
        {p: "独自引领潮流。指在某领域处于领先地位。强调“领先、引领潮流”。", a: "独领风骚"},
        {p: "避开重要的，选择次要的。指回避主要问题，只谈次要问题。强调“回避主要矛盾”。", a: "避重就轻"},
        {p: "用浮夸的言论或行为迎合众人，以博取好感。强调“浮夸、博眼球”。", a: "哗众取宠"},
        {p: "指说的话或报道内容夸大其词，甚至故意制造骇人假象，以引起人们的震惊。", a: "耸人听闻"},
        {p: "看起来像是对的，实际上却是错的。指表面正确，实质错误。", a: "似是而非"},
        {p: "本来是假的，结果却变成了真的。指把假的事情做成了真的。", a: "弄假成真"},
        {p: "形容文献、资料、书籍等数量极其繁多，像烟雾笼罩的大海一样望不到边。数量多到无法计数", a: "浩如烟海"},
        {p: "形容多而杂乱，没有条理。", a: "纷繁芜杂"},
        {p: "用牛运书，牛要累得出汗；把书放在屋里，要堆满整个屋子。形容藏书极多。", a: "汗牛充栋"},
        {p: "形容书籍或文献资料数量极其庞大，多到难以计数，也形容篇幅非常的长", a: "卷帙浩繁"},
        {p: "形容数量很多，但不专指书籍。", a: "车载斗量"},
        {p: "像鱼鳞和梳子齿一样依次排列。形容房屋、船只等排列紧密整齐。", a: "鳞次栉比"},
        {p: "像梦一样不真实。形容美好而虚幻。强调“美好而不真实”。", a: "如梦如幻"},
        {p: "很难做到的事竟然做到了，所以值得宝贵。强调“因难得而可贵”。", a: "难能可贵"},
        {p: "水面的反光，一闪而过的影子。比喻观察不细致，印象不深刻。强调“肤浅、不深入”。", a: "浮光掠影"},
        {p: "骑着马看花。比喻粗略地观察事物。强调“观察粗略、不深入”。", a: "走马观花"},
        {p: "略微尝试一下就停止。比喻不肯深入钻研学习。强调“学习/研究不深入”。", a: "浅尝辄止"},
        {p: "用浅淡的颜色轻轻描绘，比喻说话/写文章不重视、轻率带过", a: "轻描淡写"},
        {p: "好的愈好，坏的愈坏。指强者愈强，弱者愈弱的两极分化现象。强调“两极分化、累积优势”。", a: "马太效应"},
        {p: "在沙丁鱼中放入鲶鱼，刺激沙丁鱼保持活力.比喻引入竞争/新鲜力量来激发整体活力。强调“引入竞争、激发活力”。", a: "鲶鱼效应"},
        {p: "羊群跟着头羊走。比喻盲目跟风、从众心理。强调“盲从、跟风”。", a: "羊群效应"},
        {p: "亚马逊蝴蝶扇动翅膀，可能在两周后引发美国德克萨斯州的龙卷风。比喻微小的变化可能引发巨大的连锁反应。强调“连锁反应、牵一发而动全身”。", a: "蝴蝶效应"},
        {p: "恰当的事情一般是正确的、合适的事情", a: "恰当性"},
        {p: "有合理性的事情不一定是正确的事情", a: "合理性"},
        {p: "破除旧的，建立新的。指重大的变革和创新。强调“变革、创新”。", a: "革故鼎新"},
        {p: "去除旧事物中的糟粕，取其精华，创造出新事物。指在继承的基础上创新。不一定要体现出旧的才能选择这一答案，只要有体现出新的就可以", a: "推陈出新"},
        {p: "吐出旧的，吸收新的。比喻扬弃旧的，吸收新的。强调“去旧迎新”。 不一定要体现出旧的才能选择这一答案，只要有体现出新的就可以", a: "吐故纳新"},
        {p: "把各方面知识融合，获得透彻理解。强调“融合理解”。", a: "融会贯通"},
        {p: "同时容纳、吸收各种不同的东西。指把性质不同的各种事物都收罗、容纳进来。", a: "兼收并蓄"},
        {p: "相互投合、一致。指两事物之间完美匹配。强调“相互吻合、协调”。", a: "契合"},
        {p: "合得来、相契合。指双方兴趣、意见一致。强调“彼此迎合、相互合拍”。", a: "投合"},
        {p: "故意使自己的言语或行为适合别人的心意。强调“刻意讨好、巴结”。", a: "迎合"},
        {p: "与某种标准或情况相吻合。指两者一致。强调“匹配、一致”。", a: "符合"},
        {p: "心中有底，清楚明白。指对情况有充分的了解和把握。强调“了解情况、有把握”。", a: "心中有数"},
        {p: "彼此心意相通，不用明说也能理解。指双方思想感情完全一致。强调“两人默契”。", a: "心心相印"},
        {p: "不用明说，心里已经领会。指对对方的意思有深刻的领悟。强调“默契领悟”。", a: "心领神会"},
        {p: "各种各样。指种类繁多、各式各样。强调“种类多”。", a: "形形色色"},
        {p: "众多而杂乱。指数量众多、各式各样。强调“数量多而杂”。", a: "林林总总"},
        {p: "活跃地呈现在纸上。形容描写或刻画得非常生动、逼真。仅限于文章、绘画等书面作品。", a: "跃然纸上"},
        {p: "说话像天女散花一样纷纷坠落。形容说话夸张、动听但不切实际。强调“浮夸、不实”。", a: "天花乱坠"},
        {p: "故意说吓人的话，使人听了震惊。强调“夸大事实、制造恐惧”。", a: "危言耸听"},
        {p: "高声歌唱，勇猛前进。形容情绪高昂、迅猛前进。强调“气势旺盛、速度快”。", a: "高歌猛进"},
        {p: "急切地想试试。形容心情急切、跃跃欲试。强调“急切想尝试”。", a: "跃跃欲试"},
        {p: "原指坐着讨论政事，后多指空谈理论，不付诸实践。贬义，强调“光说不练”。", a: "坐而论道"},
        {p: "在纸上谈论用兵。比喻空谈理论，不解决实际问题。强调“脱离实际”。在文段中使用要体现出“空谈理论”", a: "纸上谈兵"},
        {p: "关起门来造车。比喻脱离实际，凭主观办事。强调“脱离实际”。", a: "闭门造车"},
        {p: "在雾中看花。比喻看不真切，模糊不清。强调“认识模糊”。", a: "雾里看花"},
        {p: "不追求深入理解。指只求大概，不求透彻。强调“不深入理解”。", a: "不求甚解"},
        {p: "像蜻蜓在水面上轻轻一点。比喻做事肤浅、不深入。强调“做事不深入”。", a: "蜻蜓点水"},
        {p: "随手拿来。形容写文章或说话时能熟练地引用材料、运用词汇，毫不费力。强调“知识/素材的运用非常熟练”，侧重“引用、表达”层面的轻松。仅限于知识、典故、词汇、素材的熟练运用，不能用于“做事”。", a: "信手拈来"},
        {p: "一吐唾沫就能得到。形容极容易得到。强调“极易获得”。", a: "唾手可得"},
        {p: "驾着轻车，走在熟路上。比喻对某事有经验，做起来轻松熟练。强调“做事/办事非常熟练”，侧重“实践操作”层面的轻松。", a: "轻车熟路"},
        {p: "驾着轻车，走熟路。比喻对某事有经验，做起来轻松熟练。强调“有经验、熟练”。", a: "驾轻就熟"},
        {p: "比喻自己没有主见，只能顺从他人的意志行事。指看别人的脸色行事，任人摆布", a: "随人俯仰"},
        {p: "随着波浪起伏，跟着水流漂荡。比喻没有坚定立场，盲目跟从别人。强调“行动/立场上的盲从”。", a: "随波逐流"},
        {p: "别人说什么，自己也跟着说什么。指没有主见，只会附和。强调“言语上的盲从”。", a: "人云亦云"},
        {p: "随着世俗的潮流而起伏。指自己没有主见，跟随众人行事。更强调“顺应世俗的风气”，而“随波逐流”更强调“盲目跟从他人的行为”。", a: "随俗浮沉"},
        {p: "志向实现，心满意足。形容踌躇满志、得意洋洋。强调“满足、得意”。", a: "志得意满"},
        {p: "从容自得，心满意足。形容对自己取得的成就非常满意。强调“得意、从容”。", a: "踌躇满志"},
        {p: "豪迈的情怀和远大的志向。", a: "豪情壮志"},
        {p: "依赖别人的呼吸来生活。比喻完全依赖别人，看人脸色行事。强调“依赖、屈从”。", a: "仰人鼻息"},
        {p: "跟着坏人一起做坏事。指与坏人同流合污.强调“跟从坏人”。", a: "同流合污"},
        {p: "把本来应该分阶段完成的事情，一次就完成。指急于求成，一蹴而就。强调“一次性完成、急于求成”。", a: "毕其功于一役"},
        {p: "拆掉东墙的砖去补西墙。比喻临时救急，不是根本办法。强调“临时应付、顾此失彼”。", a: "拆东墙补西墙"},
        {p: "打着大旗做虎皮。比喻打着权威的旗号来吓唬人、蒙蔽人。强调“借助权威装腔作势”。", a: "拉大旗作虎皮"},
        {p: "采取与对方相反的方法行事。指逆潮流而动。强调“反向行事”。", a: "反其道而行之"},
        {p: "不知道该到哪里去，不知道该跟随谁。比喻不知怎么办才好，不知该听从谁的。强调“困惑、无法决断”，多指面对多种意见或选择时陷入迷茫。", a: "无所适从"},
        {p: "无路可走。比喻陷入绝境，没有出路。强调“绝境、没有希望”，多指面临极端困难，无法摆脱。", a: "走投无路"},
        {p: "一群龙没有领头的。比喻没有领路人，集体陷入混乱无序状态。强调“缺乏领导者”，多用于团队、组织、集体。", a: "群龙无首"},
        {p: "六神（道家指心、肺、肝、肾、脾、胆）都没有了主宰。形容惊慌失措，心神不定。强调“内心慌乱、不知所措”，多指个人因受到惊吓或打击而慌乱。", a: "六神无主"},
        {p: "形容言语、文章或批评非常犀利，能直接抓住问题的本质或要害。", a: "一针见血"},
        {p: "说过的话还在耳边回响。指对别人说过的话记忆犹新。强调“话语的记忆”，多指过去的叮嘱、承诺或警告仍清晰记得。", a: "言犹在耳"},
        {p: "鞭打触及到最里层。形容分析透彻，切中要害。强调“分析深刻、透彻”。", a: "鞭辟入里"},
        {p: "使气息回荡，使肠子转动。形容文章、乐曲等优美动人，感人至深。强调“感人、令人动情”，多用于文艺作品。", a: "荡气回肠"},
        {p: "声音很大，使聋子也能听见。比喻言论或文章具有极大的震撼力，能唤醒糊涂的人。强调“唤醒、震撼”，多用于警世之言、发人深省的言论。", a: "振聋发聩"},
        {p: "站在高处看远处。形容眼光远大，有远见。强调“眼光长远、战略高度”。", a: "高瞻远瞩"},
        {p: "从高屋顶上倒水，水顺势往下流。比喻从高处俯瞰全局，具有远见和战略高度。强调“视野高远、全局观强”，侧重战略高度和宏观把握。", a: "高屋建瓴"},
        {p: "提起渔网的总绳（纲），所有的网眼（目）就都张开了。比喻抓住关键环节，带动其他环节。强调“抓主要矛盾、以点带面”，侧重关键引领和系统效应。", a: "纲举目张"},
        {p: "每天都能看到初步的形态。指事物逐渐成形、初具规模。强调“正在形成、初具规模”。", a: "日见雏形"},
        {p: "大风刮起，乌云涌来。比喻事物迅速发展，声势浩大。强调“声势大、发展快”。", a: "风起云涌"},
        {p: "像太阳正午一样。比喻事物发展到鼎盛阶段。强调“达到顶峰”。", a: "如日中天"},
        {p: "事物正在兴起、发展，尚未停止。强调“刚兴起、有发展潜力”。", a: "方兴未艾"},
        {p: "像火一样红，像茶（茅草的白花）一样白。形容声势盛大、气氛热烈。强调“场面热烈、气势旺盛”。", a: "如火如荼"},
        {p: "随着时代一起进步。指不断更新，跟上时代。强调“跟上时代”。", a: "与时俱进"},
        {p: "顺应时运而产生。指在合适的时机自然出现。强调“顺应时势出现”。", a: "应运而生"},
        {p: "突然出现，横亘空中。比喻事物突然出现，影响巨大。强调“突然出现、影响大”。", a: "横空出世"},
        {p: "连做梦都在牵挂。形容思念之深，无法忘怀。强调“思念至深、难以忘怀”。", a: "魂牵梦萦"},
        {p: "心神飞到（向往的地方）。形容内心非常向往。强调“渴望、向往”。", a: "心驰神往"},
        {p: "虚度光阴、荒废岁月。指没有把握好时间，让时光白白流逝。", a: "蹉跎"},
        {p: "指事物在性质、功能、内容等方面趋于相同，缺乏差异性和独特性。强调“本质、内容上的趋同”，侧重内在品质的同化。常和“千人一面”、“回音室”搭配使用。", a: "同质化"},
        {p: "指事物按照固定的、统一的模式或模板进行生产或运作，缺乏创新。强调“形式、流程上的固定化”，侧重外在形式的标准化。", a: "模式化"},
        {p: "放倒军旗，停止敲鼓。原指停止战斗，后比喻停止行动或批评。强调“停止、结束”。", a: "偃旗息鼓"},
        {p: "指示风向的标杆。比喻某种趋势或变化的先兆、指示器。强调“指示方向、预示趋势”。", a: "风向标"},
        {p: "测量天气的仪器。比喻反映某种情况变化的标志或指标。强调“反映变化、显示状况”。", a: "晴雨表"},
        {p: "原指金属货币，后比喻价值稳定、公认可靠的事物。强调“价值稳定、可靠”。", a: "硬通货"},
        {p: "用来磨刀的石头。比喻能使人经受锻炼、提高能力的事物。强调“锻炼考验”。", a: "磨刀石"},
        {p: "新投入战斗的强劲力量。比喻新加入的骨干力量。强调“新生力量”。", a: "生力军"},
        {p: "原指检验黄金纯度的石头，比喻检验事物真伪或价值的可靠标准。强调“检验标准”。", a: "试金石"},
        {p: "指对某种理念、作品、现象等进行深入、系统的阐述和解释。", a: "诠释"},
        {p: "破解代码、解读信息。比喻理解复杂的现象或信息。强调“解读、剖析”。", a: "解码"},
        {p: "领悟、理解。指对意思、道理有深入的体会。强调“领悟、体会”。", a: "领会"},
        {p: "用局部来概括全部。指看问题片面，把个别当成整体。强调“片面推断”。", a: "以偏概全"},
        {p: "用一个点来带动整个面。指通过局部典型来推动全局。强调“典型示范、带动全局”。", a: "以点带面"},
        {p: "一片叶子遮住了眼睛。比喻被局部或表面现象所迷惑，看不清全局。强调“被迷惑、看不清”。", a: "一叶障目"},
        {p: "不顾全篇文章或谈话的内容，孤立地取一段或一句的意思。强调“曲解原意”。", a: "断章取义"},
        {p: "遇到应该做的事，积极主动去做，不退让。强调“主动承担”。", a: "当仁不让"},
        {p: "沉到水底的渣滓又浮上来。比喻已经绝迹的坏事物又重新出现。强调“坏事物重新泛起”。", a: "沉渣泛起"},
        {p: "做事马虎，不认真。指粗枝大叶、不细致。强调“马虎、不细致”。", a: "大而化之"},
        {p: "捂住自己的耳朵去偷铃铛。比喻自欺欺人.强调“自己欺骗自己”。", a: "掩耳盗铃"},
        {p: "随口说出的、无足轻重的话。指不重要的闲谈或片言只语。强调“言论不重要、没分量”。", a: "齿牙余论"},
        {p: "老书生经常说的话。比喻老一套的、没有新意的言论。强调“言论陈旧、没有新意”。", a: "老生常谈"},
        {p: "用一句话来概括。指用简洁的话把全部内容概括起来。强调“概括、总结”。", a: "一言蔽之"},
        {p: "比喻能够保护核心利益或关键人物的事物", a: "护心镜"},
        {p: "江河的水一天天向下流。比喻情况一天天变坏.强调“逐渐衰落”。", a: "江河日下"},
        {p: "写文章或说话时，对每个字、每句话都反复推敲。形容措辞严谨、态度认真。强调“推敲词句”。", a: "字斟句酌"},
        {p: "像把玉和珍珠串联在一起。比喻辞藻华美、诗句精致。强调“文采华丽”。", a: "缀玉联珠"},
        {p: "形体和精神都具备。形容作品在形式和内容上都达到了很高的水平。强调“形式与内容统一”。", a: "形神兼备"},
        {p: "由一个血统或派别传下来，彼此关联相通。强调“血脉相连、贯通”。", a: "一脉相通"},
        {p: "由一个血统或派别传下来。比喻思想、学说等有继承关系。强调“继承、延续”。", a: "一脉相承"},
        {p: "柴火烧尽，火种传下去。比喻学问、技艺、精神等代代相传。强调“传递、延续”。", a: "薪火相传"},
        {p: "不断地生长、繁衍。指生命力顽强，永不停止。强调“持续不断、生命不息”。", a: "生生不息"},
        {p: "形容时代极其久远。指永远流传。强调“永久流传”。", a: "千秋万古"},
        {p: "不加区分地全面灌溉。比喻不分对象、不加区分地统一实施。", a: "大水漫灌"},
        {p: "从全局上观察和把握形势。强调“宏观视野”。", a: "通观大局"},
        {p: "源头有流动的水。比喻事物发展的源泉和动力。强调“源泉、动力”。", a: "源头活水"},
        {p: "必须经过的道路。指事物发展必须遵循的规律或途径。强调“必由之路”。", a: "必由之路"},
        {p: "题目中本来就应该包含的意思。指事物本身所包含的道理。强调“内在包含”。", a: "题中之义"},
        {p: "不局限于一种规格或方式。指打破常规，灵活多样。强调“打破常规”。", a: "不拘一格"},
        {p: "直接触动人的内心。形容言语或行为产生强烈共鸣。强调“触动内心”。", a: "直击人心"},
        {p: "指军队或武装人员发生叛变、暴动。也可以比喻某个群体因不满而突然反叛。", a: "哗变"},
        {p: "表现得十分生动、精彩、逼真。指说话、表演或文章内容精彩，有感染力。", a: "有声有色"},
        {p: "嘲笑、戏弄。指用言语或行动使人难堪、受到羞辱。强调“带有恶意的嘲笑和捉弄”，行为较为直接。", a: "嘲弄"},
        {p: "嘲笑、戏弄。与“嘲弄”同义，但更书面化、更文雅。强调“带有讽刺意味的调侃”，通常不直接攻击，而是用委婉或幽默的方式取笑。", a: "揶揄"},
        {p: "用言语戏弄、开玩笑。指以轻松、幽默的方式取笑人或事。强调“开玩笑、幽默”，通常不含恶意，是朋友间的玩笑或轻松的表达。", a: "调侃"},
        {p: "像织布梭子一样来回活动。形容频繁往来、忙碌不停。强调“频繁、快速往来”。", a: "穿梭"},
        {p: "沉迷于某处，舍不得离开。指被美好事物吸引而忘归。强调“被吸引、不想走”。", a: "流连"},
        {p: "在一个地方来回走动。比喻犹豫不决、拿不定主意。强调“来回走、犹豫”。", a: "徘徊"},
        {p: "悠闲地行走、自由自在地游荡。指从容、自在地走。强调“悠闲、自在”。", a: "徜徉"},
        {p: "按照图像去寻找好马。比喻按照线索去寻找事物，也比喻办事机械、死板。", a: "按图索骥"},
        {p: "顺着藤蔓摸到瓜。比喻沿着线索追查下去，找到结果。强调“沿着线索逐步追查”，侧重于推理过程。", a: "顺藤摸瓜"},
        {p: "风梳头，雨洗头。形容长期在外面奔波，不避风雨，比喻辛苦劳碌。强调“奔波劳苦”。", a: "栉风沐雨"},
        {p: "离开某种环境或状态。指从某事物中分离开来。强调“分离开”。", a: "脱离"},
        {p: "从束缚中摆脱出来。指获得自由，不再受困扰。强调“身心自由、释然”。", a: "解脱"},
        {p: "解除束缚，获得自由。指从压迫或限制中解放出来。强调“重大解放”。", a: "解放"},
        {p: "挣脱、脱离。指从困难或不利的境地中脱离出来。强调“主动挣脱”。", a: "摆脱"},
        {p: "船开到江心才去补漏洞。比喻临到紧急关头才采取补救措施。强调“补救太晚”。", a: "江心补漏"},
        {p: "各管各的，不顾全局。指缺乏统一协调。强调“不统一、各干各的”。多指“系统间、部门间、区域间、国家之间各自管理，各自一个标准”", a: "各自为政"},
        {p: "固执己见，自以为是。指只凭自己的主观想法行事，不听别人意见。强调“固执、自以为是”。", a: "师心自用"},
        {p: "形容话语铿锵有力，坚定有力。比喻言辞坚定、有分量。", a: "掷地有声"},
        {p: "猛烈撞击。指强烈的影响或打击。强调“强烈、剧烈”。", a: "冲击"},
        {p: "偶然相遇。指不期而遇、偶然碰到。强调“偶然、巧遇”。", a: "邂逅"},
        {p: "两者相遇后产生相互作用。比喻不同思想、文化的交流与冲突。强调“交流、冲突”。", a: "碰撞"},
        {p: "几种不同的事物合为一体。指有机整合。强调“合而为一”。", a: "融合"},
        {p: "同时容纳、兼容。指多种事物可以共存。强调“共存”。", a: "兼容"},
        {p: "连接、相通。指彼此连通、相互关联。强调“连接相通”。", a: "联通"},
        {p: "连接、接合。指前后连接，过渡自然。强调“连接过渡”。", a: "衔接"},
        {p: "深入挖掘、发现。指把隐藏的事物找出来。强调“发现、找出”。", a: "发掘"},
        {p: "把囚禁或束缚的人或物放出来。比喻把潜在的能量、力量释放出来。强调“释放、解放”。", a: "释放"},
        {p: "向下挖、发掘.指从深处寻找、发现。强调“深入探寻”。", a: "挖掘"},
        {p: "多方寻求答案。指研究、寻找未知的事物。强调“研究、寻找”。", a: "探索"},
        {p: "文章读起来不顺口，艰涩难懂。强调“艰涩难懂”。", a: "佶屈聱牙"},
        {p: "只说空话，不付诸实践。指空谈、不兑现。强调“空谈”。", a: "徒托空言"},
        {p: "去除芜杂，保留精华。指去掉糟粕，留下精华。强调“去粗取精”。", a: "去芜存菁"},
        {p: "像神仙点化一样的笔法。形容作品中极其精妙、绝妙的笔触或构思。强调“精妙绝伦”。", a: "神来之笔"},
        {p: "鸿雁在雪泥上留下的爪印。比喻往事留下的痕迹。强调“痕迹”。", a: "雪泥鸿爪"},
        {p: "羚羊挂角，无迹可寻。比喻诗文意境超脱，不着痕迹。强调“不着痕迹”。", a: "羚羊挂角"},
        {p: "像从一个车辙里出来一样。比喻两件事非常相似。强调“极其相似”。", a: "如出一辙"},
        {p: "一旦形成，就不再改变。指固定不变，没有发展变化（时间上）。侧重事物本身缺乏变化。多用于批评僵化、不与时俱进。", a: "一成不变"},
        {p: "指完全按一个模式办事，没有变化和创新。侧重多个事物之间高度相似。", a: "千篇一律"},
        {p: "一千个人都长着同一张面孔。比喻雷同、没有个性。强调“缺乏个性”。", a: "千人一面"},
        {p: "非常小心谨慎，以至害怕。原为臣子对皇帝的敬畏之词，现多形容谨慎不安。强调“谨慎、害怕”。", a: "诚惶诚恐"},
        {p: "不知怎么办才好。指面对多种选择或意见时陷入困惑。强调“困惑、无法决断”。", a: "无所适从"},
        {p: "像坐在插了针的毡子上。形容心神不宁、坐立不安。强调“不安、焦虑”。", a: "如坐针毡"},
        {p: "树根盘绕，枝节交错。比喻事物关系复杂、难以处理。强调“复杂、难理清”。", a: "盘根错节"},
        {p: "嘴唇和牙齿相互依存。比喻关系密切，利害相关。强调“利害与共”。", a: "唇齿相依"},
        {p: "千根丝，万根线。比喻联系复杂繁多。强调“联系多而密”。", a: "千丝万缕"},
        {p: "像影子一样紧跟着。比喻关系密切，无法分离。强调“紧密伴随”。", a: "如影随形"},
        {p: "放在一边，好像没听见。指不予理睬、漠不关心。强调“不理睬、漠视”。", a: "置若罔闻"},
        {p: "打着节拍赞叹。形容对诗文或表演极其赞赏。强调“赞赏、敬佩”。", a: "击节赞叹"},
        {p: "具有独特的风格。指与众不同，有特色。强调“风格独特”。", a: "别具一格"},
        {p: "交错纷杂，富有情趣。形容布局参差错落，富有美感。强调“布局有致”。", a: "错落有致"},
        {p: "达到极高的境界。形容技艺极其高超，达到了绝妙的境界。强调“技艺高超”。", a: "出神入化"},
        {p: "形容文章或说话表达得充分、透彻。也指表达得非常充分。强调“表达充分透彻”。", a: "淋漓尽致"},
        {p: "具有与众不同的巧妙构思。指构思巧妙、独特。强调“构思巧妙”。", a: "独具匠心"},
        {p: "描写或模仿得非常逼真。指形象生动、逼真。强调“逼真、生动”。", a: "惟妙惟肖"},
        {p: "推究事物原理，获得知识。指通过探究万物来获得真知.强调“探究获知”。", a: "格物致知"},
        {p: "认识与实践相统一。指知与行不可分割。强调“知与行统一”。", a: "知行合一"},
        {p: "将学到的知识用于实践。指学用结合。强调“学用结合”。", a: "学以致用"},
        {p: "直到头发白了还在钻研经典。形容终身致力于学问。强调“终身钻研”。", a: "皓首穷经"},
        {p: "严密、谨慎。指逻辑严密，没有漏洞。强调“严密、无疏漏”。", a: "严谨"},
        {p: "细致、周密。指思考或计划非常细致周密。强调“细致入微”。多用于思维、逻辑、调查（可以用于逻辑，是褒义）", a: "缜密"},
        {p: "重新构建。指打乱原有结构并重新建立。强调“重新建立”。", a: "重构"},
        {p: "颠倒、推翻。指彻底改变或推翻原有状态。强调“彻底推翻”。", a: "颠覆"},
        {p: "使隐藏的东西暴露出来。指揭发、使显现。强调“揭发、暴露”。", a: "揭露"},
        {p: "透彻地了解、清楚地知道。指看得很透彻。强调“透彻理解”。", a: "洞悉"},
        {p: "比喻相差很远，大不相同。指两者差异巨大。强调“差别大”。", a: "大相径庭"},
        {p: "互相之间距离很远。指差距很大。强调“距离大”。", a: "相去甚远"},
        {p: "没有邀请就自己来了。指自己主动到来。强调“主动到来”。", a: "不请自来"},
        {p: "没有约定就来了。指意外地到来。强调“意外到来”。", a: "不期而至"},
        {p: "设定标准或目标。指明确地规定或指定。通过测量或计算，确定某个物体或目标的具体位置、坐标或参数。强调“设定标准”。用于坐标、目标、参数。“标定方向”不合适", a: "标定"},
        {p: "准确地把握。指精准地理解或掌握。强调“精准把握”。用于方向、脉搏、规律", a: "把准"},
        {p: "波澜壮阔【褒义】：波浪汹涌，场面宏大。形容声势雄壮，规模宏大。强调“声势宏大”。用于历史、时代、画卷", a: "波澜壮阔"},
        {p: "没有源头的水。比喻没有基础、来源的事物。强调“没有根基”。", a: "无源之水"},
        {p: "悬在空中的楼阁。比喻虚幻的事物或脱离实际的计划。强调“脱离实际”。", a: "空中楼阁"},
        {p: "在眼前飘过的云烟。比喻事物很快消失，不留痕迹。强调“短暂、易逝”。", a: "过眼云烟"},
        {p: "爱惜笔墨如同爱惜金子。指写作、绘画不轻易下笔，极为简练。强调“极度简练”。", a: "惜墨如金"},
        {p: "语言简洁，意思完备。指表达简明扼要。强调“简洁且全面”。", a: "言简意赅"},
        {p: "比喻各种学术派别自由争论。指学术繁荣。强调“学术争论”。", a: "百家争鸣"},
        {p: "尽量给下属和群众创造发表意见的条件。强调“鼓励提意见”。多用于决策上政府部门畅通渠道，多方听取意见，集思广益", a: "广开言路"},
        {p: "超越本分、越权行事。指超越自己的地位或权限。强调“越权、越界”。", a: "僭越"},
        {p: "眼中没有完整的牛。形容技艺极其纯熟，达到得心应手的境界。强调“技艺纯熟”。", a: "目无全牛"},
        {p: "多次见到，已经不觉得新奇。指经常见到。强调“见多了不稀奇”。", a: "屡见不鲜"},
        {p: "看惯了就不觉得奇怪。指某事常见，不足为奇。强调“习惯了、不觉得奇怪”。", a: "司空见惯"},
        {p: "低头拾取，到处都是。比喻数量极多，随处可见。强调“到处都有”。", a: "俯拾皆是"},
        {p: "涉及的范围大、面积广。指覆盖面大。强调“范围广”。", a: "广泛"},
        {p: "多种多样。指构成成分多样、不单一。强调“多样性”。", a: "多元"},
        {p: "前车翻倒，后车继续走老路。比喻不吸取前人教训，继续犯错。强调“不吸取教训”。", a: "覆车继轨"},
        {p: "再走翻过车的老路。比喻不吸取教训，再犯同样的错误。强调“重复犯同样的错”。", a: "重蹈覆辙"},
        {p: "只凭主观判断行事，不讲道理。指盲目下结论，不听取他人意见。强调“主观、独断”。", a: "武断"},
        {p: "说话做事随便，不慎重。指缺乏深思熟虑。强调“不慎重、草率”。", a: "轻率"},
        {p: "粗心、冒失。指做事草率，缺乏考虑。强调“冲动、冒失”。", a: "鲁莽"},
        {p: "用艺术手段表现、刻画。也指通过教育等方式培养。强调“创造、表现”。", a: "塑造"},
        {p: "在艰苦环境中锻炼。指经受考验而成长。强调“经受锻炼”。", a: "磨炼"},
        {p: "建立、确立。指使某种观念或形象得以确立。强调“确立建立”。", a: "树立"},
        {p: "使人感到难办、心烦。指被问题纠缠而不得安宁。强调“烦恼、为难”。", a: "困扰"},
        {p: "辨不清是非，摸不着头脑。指认知上的困惑。强调“困惑、不解”。", a: "迷惑"},
        {p: "适宜于草木生长的和风细雨.比喻良好的教育和熏陶。强调“潜移默化的教化”。", a: "春风化雨"},
        {p: "温和的风，细小的雨。比喻方式温和、不粗暴。强调“方式温和”。", a: "和风细雨"},
        {p: "无声地滋润万物。比喻潜移默化的影响。强调“无声渗透”。", a: "润物无声"},
        {p: "善于有步骤地引导别人。指耐心、有序地教导。强调“善于引导”。", a: "循循善诱"},
        {p: "大量出现。指人或事物如泉水般大量涌现。强调“大量、集中”。", a: "涌现"},
        {p: "显现、展示。指清晰地展示出来。强调“展示、显露”。", a: "呈现"},
        {p: "呈现、显露。指事物在头脑中或眼前显现。强调“显现于眼前/脑海”。", a: "浮现"},
        {p: "清楚、突出地显示出来。指从背景中显现出来。强调“突出、明显”。", a: "凸显"},
        {p: "对人对事要求完美无缺。指过分苛求。强调“苛求完美”。", a: "求全责备"},
        {p: "在军帐中策划谋略。比喻在后方进行策划指挥。强调“统筹谋划”。", a: "运筹帷幄"},
        {p: "设想自己处在别人的地位或境遇中。指替别人着想。强调“换位思考”。", a: "设身处地"},
        {p: "以前的功劳或努力全部白费。指之前的努力全部付诸东流。强调“已有成果被废弃”，侧重“努力白费”。", a: "前功尽弃"},
        {p: "只差一筐土而未能成功。比喻做事只差最后一点而失败。强调“只差最后一步”，侧重“功败垂成”。", a: "功亏一篑"},
        {p: "向上托起、举起。比喻扶持、支持。强调“支撑、扶持”。", a: "托举"},
        {p: "突然出现，横亘空中。比喻事物突然出现，影响巨大。强调“突然出现”。", a: "横空出世"},
        {p: "蓬勃兴起。指事物迅速兴起、蓬勃发展。强调“迅速兴起”。", a: "勃然而兴"},
        {p: "拨开乌云，看见太阳。比喻消除障碍，重见光明。强调“看清真相、摆脱困境”。", a: "拨云见日"},
        {p: "反过来要求自己。指遇到挫折或失败时，从自己身上找原因。强调“自我反省”。", a: "反求诸己"},
        {p: "表面上关系好，实际各有打算。指表面一致，内心不合。强调“表里不一”。", a: "貌合神离"},
        {p: "不走常规，用出奇的方法取胜。指采用非常规手段。强调“非常规方法”。", a: "剑走偏锋"},
        {p: "李树代替桃树受难。比喻互相替代，代人受过。强调“替代、顶替”。", a: "李代桃僵"},
        {p: "鞭打走得快的牛。比喻越是能干的人，承担的越多。强调“能干者多劳”。", a: "鞭打快牛"},
        {p: "狼多，肉少。比喻需求多，供给少。强调“供不应求”。", a: "狼多肉少"},
        {p: "用含蓄的语言或文字间接暗示。多指含沙射影。强调“间接暗示”。", a: "影射"},
        {p: "光线通过介质改变方向。比喻间接地反映出某种情况。强调“间接反映”。", a: "折射"},
        {p: "像蚕吃桑叶一样逐步侵占。指一点一点地侵蚀、吞并。强调“逐步、渐进”。", a: "蚕食"},
        {p: "逐渐消耗、磨灭。指在不知不觉中减少或消失。强调“逐渐消耗”。", a: "消磨"},
        {p: "像珠玉一样光辉美丽。形容光彩照人、华美。强调“光彩华美”。多用于：容颜、服饰、珠宝", a: "珠辉玉丽"},
        {p: "忽明忽暗，隐约可见。形容时隐时现、不清晰。强调“时隐时现”。", a: "明灭可见"},
        {p: "根扎得深，叶子就茂盛。比喻基础牢固，发展兴旺。强调“根基深厚”。", a: "根深叶茂"},
        {p: "驰骋思绪，遐想。指自由地、无拘束地想象。强调“自由想象”。", a: "驰思遐想"},
        {p: "在大浪中冲洗沙石。比喻在激烈的斗争中，优秀者脱颖而出。强调“优胜劣汰”。", a: "大浪淘沙"},
        {p: "弱者被强者吞食。比喻强者欺压弱者。强调“强者欺压弱者”。", a: "弱肉强食"},
        {p: "听从好的意见像流水一样自然。指善于接受好的建议。强调“虚心纳谏”。", a: "从善如流"},
        {p: "偏向一方，不公正。指偏心、徇私。强调“不公正”。一般不用于形容自己", a: "偏私"},
        {p: "双手合十，跪拜致敬。比喻极度崇拜、崇敬。强调“极度崇拜”。", a: "顶礼膜拜"},
        {p: "行路远，登高。比喻不断进步，达到更高境界。强调“不断向上”。", a: "行远升高"},
        {p: "自己织出布来。比喻诗文、创作等有独创的风格，不落俗套。强调“独创风格”。", a: "自出机杼"},
        {p: "不落入俗套。指有独创精神，不拘泥于旧框框。强调“打破俗套”。", a: "不落窠臼"},
        {p: "神秘到了极点。形容非常奇妙神秘。强调“极其神秘”。", a: "神乎其神"},
        {p: "经过很长时间也不衰退。指长期保持兴盛。强调“持续兴盛”。", a: "经久不衰"},
        {p: "光辉日日更新。指进步迅速，日新月异。强调“不断进步”。", a: "辉光日新"},
        {p: "子贡赎回了鲁国奴隶而不领赏金。故事强调了“行善不图回报”的道德高度，但也引发了关于“道德标准过高反而让人不敢行善”的讨论。强调“行善与标准”。", a: "子贡赎人"},
        {p: "子路救了一个落水者，接受了对方赠送的一头牛。孔子赞赏他，认为这会鼓励更多人见义勇为。故事强调了“适当回报可以激励善行”。强调“激励与回报”。", a: "子路受牛"},
        {p: "颜回与卖布人争论“三八二十三”还是“二十四”，孔子判颜回输.故事体现了孔子的教育智慧和“不争”的处世态度。强调“智慧、不争”。", a: "颜回输冠"},
        {p: "孔子向七岁的项橐（tuó）请教问题，拜他为师。故事体现了孔子的谦虚好学和“不耻下问”的精神。强调“谦虚好学”。", a: "孔子相师"},
        {p: "指出错误，加以批评。指善意或中性的批评。强调“指出问题”。", a: "指摘"},
        {p: "恶意毁谤、攻击。指不实的恶意中伤。强调“恶意攻击”。", a: "诋毁"},
        {p: "批评指责。指对错误提出批评。强调“批评”。", a: "责备"},
        {p: "用言语或文字攻击。指严厉的批评或攻击。强调“严厉攻击”。", a: "抨击"},
        {p: "闭口不说，像瓶口塞紧一样。形容说话谨慎，严守秘密。强调“严守秘密”。", a: "守口如瓶"},
        {p: "保守秘密，不公开。指有意保密，不对外公布。强调“保密不公开”。", a: "秘而不宣"},
        {p: "把事情紧紧隐瞒住，不肯透露。指隐瞒很深.强调“刻意隐瞒”。", a: "讳莫如深"},
        {p: "秋天鸟兽新长出的细毛的尖端。形容极其细微的事物。强调“极其细微”。", a: "秋毫之末"},
        {p: "树木的一根枝条、一个节。比喻事物的一个部分或片段。强调“部分、片段”。", a: "一枝一节"},
        {p: "九头牛身上的一根毛。比喻数量极少，微不足道。强调“数量极少”。", a: "九牛一毛"},
        {p: "大海中的一粒谷子。比喻极其渺小。强调“极其渺小”。", a: "沧海一粟"},
        {p: "相互投合、一致。指两者完美匹配。强调“吻合一致”。", a: "契合"},
        {p: "审视、观察。指从特定角度观察和反思。强调“审视、反思”。", a: "观照"},
        {p: "故意装出强大的声势来吓唬人。指假装强大，以掩饰虚弱。强调“装腔作势、以势压人”。", a: "虚张声势"},
        {p: "使人听了非常吃惊（多指社会上发生的坏事）。指事情本身极其坏，令人震惊。强调“事情本身可怕、令人震惊”。", a: "骇人听闻"},
        {p: "路上的人都都知道。比喻众所周知、公开的秘密。强调“公开、人人皆知”。", a: "路人皆知"},
        {p: "长期谋划，费尽心机。指蓄谋已久。强调“蓄谋、费心”。", a: "处心积虑"},
        {p: "费尽心思谋划经营。指长期用心经营。强调“用心经营”。", a: "苦心经营"},
        {p: "正好切中肯綮（筋骨结合处）。比喻抓住要害，切中关键。强调“抓住关键”。", a: "切中肯綮"},
        {p: "穿着铠甲，拿着兵器。形容全副武装，准备战斗。强调“武装上阵”。", a: "披坚执锐"},
        {p: "磨砺节操和品行。指磨炼品德、修养。强调“磨炼品行”。", a: "砥节砺行"},
        {p: "一直向前，无所阻挡。形容勇猛无畏。强调“勇猛、不退缩”。", a: "一往无前"},
        {p: "从头到尾穿过。指连贯地存在于整个过程或事物中。强调“贯穿始终”。", a: "贯穿"},
        {p: "融合进入。指成为其中一部分。强调“有机融合”。", a: "融入"},
        {p: "包含在……之中。指某种含义或道理隐含其中。强调“隐含其中”。", a: "寓于"},
        {p: "将外部事物嵌入内部。指强制或刻意插入。强调“嵌入、插入”。", a: "植入"},
        {p: "重新构建。指打乱原有结构并重新建立。强调“重新建立”。", a: "重构"},
        {p: "加润滑油使运转顺滑。比喻使关系或过程顺畅.强调“使顺畅”。", a: "润滑"},
        {p: "连接、相通。指彼此连通、相互关联。强调“连接相通”。", a: "联通"},
        {p: "堵塞的地方。比喻流程中阻碍顺畅的环节。强调“堵塞阻碍”。", a: "堵点"},
        {p: "堵塞、阻碍。指通道被堵住，难以通行。强调“严重堵塞”。", a: "梗阻"},
        {p: "阻挡前进的东西。指阻碍发展的因素。强调“阻碍因素”。", a: "障碍"},
        {p: "使事情不能顺利进行。指造成阻碍。强调“造成阻碍”。", a: "妨碍"},
        {p: "雨后春笋大量长出。比喻新生事物大量涌现。强调“大量涌现”。", a: "雨后春笋"},
        {p: "像恒河里的沙子一样多。形容数量极多，无法计数。强调“极多”。", a: "恒河沙数"},
        {p: "猫头鹰和乌鸦喜欢吃老鼠。比喻各有各的偏好。强调“各有所好”。", a: "鸮鸦嗜鼠"},
        {p: "骑在老虎背上难以下来。比喻陷入进退两难的境地。强调“进退两难”。", a: "骑虎难下"},
        {p: "站在高处俯视下方。比喻处于有利地位，以傲慢的态度看待他人。强调“傲慢俯视”。", a: "居高临下"},
        {p: "以傲慢的气势压人。形容态度傲慢、气势逼人。强调“傲慢、咄咄逼人”。", a: "盛气凌人"},
        {p: "作为主体的地位和属性。指自主、独立、主导。强调“自主地位”。", a: "主体性"},
        {p: "独立自主、不受支配。指自我决定的能力。强调“自我决定”。", a: "自主性"},
        {p: "一个角落的地方。指非常狭小的地方。强调“狭小”。", a: "一隅之地"},
        {p: "插下锥子的地方。比喻极其狭小的地方。强调“极小”。", a: "立锥之地"},
        {p: "和谐相处，但不盲目附和。指在保持独立见解的同时，能够和谐共存。强调“和谐共处且保留差异”。", a: "和而不同"},
        {p: "珍珠联成串，美玉合在一起。比喻优秀的人或美好的事物结合在一起。强调“两者完美结合”。", a: "珠联璧合"},
        {p: "自然形成，没有人工雕琢的痕迹。形容才艺、文章或景物完美自然。强调“自然完美、没有人工痕迹”。", a: "浑然天成"},
        {p: "顺应潮流或趋势而行事.指不逆势而动，利用已有的趋势。强调“顺应趋势”，侧重于“被动顺应、不违逆”。", a: "顺势而为"},
        {p: "充分发挥物品的效用。指使各种东西的功能得到充分利用。强调“充分利用资源”，侧重于“不浪费、发挥效用”。", a: "物尽其用"},
        {p: "顺着事物发展的趋势加以引导。指主动利用趋势，将其引向有利的方向。强调“主动引导、化势为利”，比“顺势而为”更强调“主动性”。", a: "因势利导"},
        {p: "通过规则进行规范、约束。指用制度或法律来约束。强调“制度规范”。", a: "规制"},
        {p: "比喻摧毁腐朽势力极其容易。形容力量强大，势不可挡。强调“力量强大”。", a: "摧枯拉朽"},
        {p: "悲哀但不过分悲伤。指情感适度，不过度。强调“情感适度”。", a: "哀而不伤"},
        {p: "说话或做事十分恰当、合适。指分寸掌握得好。强调“恰到好处”。", a: "恰如其分"},
        {p: "枝叶繁密茂盛。比喻子孙兴旺或事业繁荣。强调“繁荣兴旺”。", a: "枝繁叶茂"},
        {p: "草木苍翠茂盛。形容生机勃勃、茂盛。强调“生机旺盛”。多用于植被、景象、生机", a: "郁郁葱葱"},
        {p: "众人的口味难以调和。比喻很难让所有人都满意。强调“难以满足所有人”。", a: "众口难调"},
        {p: "意见纷争，不能决定哪个是对的。指大家意见不一致。强调“意见分歧”。", a: "莫衷一是"},
        {p: "众人同声，足以熔化金属。比喻舆论力量强大，能混淆是非。强调“舆论力量大”。", a: "众口铄金"},
        {p: "口头传授，内心领会。指师徒之间通过口头讲解和内心领悟来传承技艺。强调“师徒间口头传授”。", a: "口传心授"},
        {p: "从路上听来的话。指没有根据的传闻。强调“没有根据的传闻”。", a: "道听途说"},
        {p: "口头一代代传下来。指通过口头方式相传。强调“口头相传”。", a: "口口相传"},
        {p: "在错误或坏事刚露出苗头时就加以防范。指消灭在萌芽状态。强调“抓早抓小”。多用于廉政、纪律、问题", a: "防微杜渐"},
        {p: "在事故或灾害发生之前就加以预防。指提前防范。强调“提前预防”。多用于风险、安全、事故", a: "防患未然"},
        {p: "不进行教育，犯了错就惩罚。指事先不教育，犯错就严惩。强调“不教育就惩罚”。", a: "不教而诛"},
        {p: "形容文艺作品、建筑风格、服饰设计、个人气质等具有独特的风格，与众不同", a: "别具一格"},
        {p: "具有与众不同的巧妙构思。指构思巧妙、独特。强调“构思巧妙”。", a: "匠心独运"},
        {p: "另外开辟一条路。比喻独创一种新方法。强调“另创新路”。", a: "另辟蹊径"},
        {p: "登上厅堂，进入内室。比喻学问或技艺达到较高水平。强调“达到较高水平”。", a: "登堂入室"},
        {p: "炼丹炉火达到纯青之色。比喻学问、技艺达到纯熟完美的境界。强调“纯熟完美”。", a: "炉火纯青"},
        {p: "到处都开花。比喻好的事物到处涌现、普遍发展。强调“广泛兴起”。", a: "遍地开花"},
        {p: "各自有不同的想法或打算。指各怀心思，不统一。强调“各怀心思”。", a: "各有怀抱"},
        {p: "形容议论纷纷或反动言论十分嚣张。指错误的言论或风气盛行。强调“错误言论盛行”。", a: "甚嚣尘上"},
        {p: "闪光发亮，光彩闪耀。形容光彩夺目、闪闪发光。强调“光彩闪耀”。适用对象：宝石、灯光、品德、成就。", a: "熠熠生辉"},
        {p: "像深渊一样深沉，像山岳一样屹立。比喻人的品德或气度深沉稳重。强调“深沉稳重”。", a: "渊渟岳峙"},
        {p: "大海平静，黄河水清。比喻天下太平、国泰民安。强调“太平盛世”。", a: "海晏河清"},
        {p: "聚集天地灵气，孕育优秀人才。形容山川秀美，人才辈出。强调“山水秀美、人才辈出”。", a: "钟灵毓秀"},
        {p: "互相配合，彼此更显优势。指两者结合后效果更好。强调“互相促进”。", a: "相得益彰"},
        {p: "珍珠联成串，美玉合在一起。比喻优秀的人或美好的事物结合在一起。强调“完美结合”。", a: "珠联璧合"},
        {p: "互相补充，互相配合。指两者缺一不可，共同起作用。强调“互相补充”。", a: "相辅相成"},
        {p: "同时进行，互不冲突。指可以共存、兼容。强调“不冲突”。", a: "并行不悖"},
        {p: "表达、倾吐。指把情感或意见表达出来。强调“情感表达”。", a: "抒发"},
        {p: "深入分析、解剖。指对事物进行透彻的分析。强调“深入分析”。", a: "剖析"},
        {p: "深入、系统地解释。指对事物进行全面的阐释。强调“深入阐释”。", a: "诠释"},
        {p: "详细陈述、说明。指有条理地解释说明。强调“详细说明”。", a: "阐述"},
        {p: "长期积累的问题难以解决。指积弊很深，难以改变。强调“问题积弊深”。", a: "积重难返"},
        {p: "根扎得深，蒂结得牢.比喻基础深厚，难以动摇。强调“基础深厚”。", a: "根深蒂固"},
        {p: "深深地印在人们的心里。指观点或政策被广泛认同。强调“被广泛认同”。", a: "深入人心"},
        {p: "使人惊讶得说不出话。形容令人震惊、惊奇。强调“惊讶”。", a: "令人咋舌"},
        {p: "暗中渡过陈仓。比喻暗中进行活动。强调“暗中行动”。", a: "暗度陈仓"},
        {p: "金蝉脱去外壳。比喻用计脱身或转移。强调“脱身转移”。", a: "金蝉脱壳"},
        {p: "像鼎的三足一样并立。比喻三方势力并列，互相对峙。强调“三方并立”。", a: "鼎足而立"},
        {p: "像灿烂的星星一样。形容数量众多且璀璨耀眼。强调“多且出色”。", a: "灿若繁星"},
        {p: "比得上、相匹敌。指两者水平相当。强调“水平相当”。", a: "媲美"},
        {p: "并肩、地位相等。指两者实力相当。强调“地位相当”。", a: "比肩"},
        {p: "争强、争胜。指争夺优势或主导地位。强调“争夺优势”。", a: "争雄"},
        {p: "彼此相当、不相上下。指两者力量相当。强调“力量相当”。", a: "匹敌"},
        {p: "演变、蜕变。指事物发生根本性的变化。强调“根本变化”。", a: "嬗变"},
        {p: "洗涤、清除。指彻底清除不好的东西。强调“彻底清除”。", a: "荡涤"},
        {p: "彻底铲除。指从根源上消灭。强调“根除”。", a: "根除"},
        {p: "像流星划过天空一样急迫。形容非常紧急。强调“极度紧急”。", a: "急如星火"},
        {p: "百鸟的嘴都一样。比喻众人说法一致。强调“说法一致”。", a: "百喙如一"},
        {p: "信息同质化、回音室效应。指观点重复、缺乏多元。强调“同质化”。", a: "回音室"},
        {p: "美味人人爱吃。比喻好的诗文或事物被人人称赞。", a: "脍炙人口"},
        {p: "喜欢听，乐意看。指很受欢迎。强调“受欢迎”。", a: "喜闻乐见"},
        {p: "家家户户都知道。形容名声极大、众所周知。", a: "家喻户晓"},
        {p: "用具体事物代表抽象意义。指标志性代表。强调“代表意义”。", a: "象征"},
        {p: "能代表全局的局部。指集中反映整体特点。强调“集中反映”。", a: "缩影"},
        {p: "表明特征、起标识作用的记号。指显著特征。强调“标识”。", a: "标志"},
        {p: "真实刻画、反映。指对事物真实的呈现。强调“真实反映”。", a: "写照"},
        {p: "将某种属性或情感映射到外部。强调“单向映射”。强调“单向输出”。", a: "投射"},
        {p: "光线通过介质改变方向。比喻间接反映出某种情况。强调“间接反映”。", a: "折射"},
        {p: "照射、反映。指把事物反映出来。强调“反映”。", a: "映射"},
        {p: "光线弹回。比喻事物之间的相互反映。强调“相互反映”。", a: "反射"},
        {p: "羽毛堆积多了也能把船压沉。比喻细微的事物积累多了会产生巨大的力量。强调“细微积累的巨大力量”，侧重“量变引起质变”。", a: "积羽沉舟"},
        {p: "聚沙成塔，积少成多。比喻积少成多，汇集小力量成大力量.强调“积少成多”，侧重“积累的力量”。", a: "聚沙成塔"},
        {p: "狐狸腋下的皮虽小，但聚集起来就能缝成皮袍。比喻积少成多，聚小成大。褒义，强调“积累的力量”", a: "集腋成裘"},
        {p: "三个人谎报有老虎，大家就真以为有老虎。比喻谣言或讹传反复传播，就能使人信以为真。强调“谣言重复多次使人信以为真”，侧重“谣言的传播力量”。", a: "三人成虎"},
        {p: "众人同声，足以熔化金属。比喻舆论力量强大，能混淆是非。强调“舆论的力量足以颠倒黑白”，侧重“舆论的破坏性”。", a: "众口铄金"},
        {p: "抓住关键，掌控全局。指以少数控制多数。强调“抓关键统全局”。", a: "以一持万"},
        {p: "充满、塞满。多指不好的事物充满某处。强调“充满”。", a: "充斥"},
        {p: "寄托、隐含。指把某种情感或含义寄托于事物中。强调“寄托、隐含”。", a: "寄寓"},
        {p: "把本来统一的整体分开。指强行分开。强调“分开”。", a: "割裂"},
        {p: "失去联系、不相衔接。指衔接不上。强调“衔接不上”。", a: "脱节"},
        {p: "倡导、鼓励（某种行为或观念）。指鼓励大家去做。强调“鼓励支持”。", a: "提倡"},
        {p: "规劝、进谏。指以正直之言劝告他人。强调“劝告”。", a: "规谏"},
        {p: "带头提倡、引导。指积极引导大家做某事。强调“带头引导”。", a: "倡导"},
        {p: "像看待珍贵的美玉一样。指极为珍视、爱护。强调“极其珍视”。", a: "视若拱璧"},
        {p: "冷淡地放在一边。指对事物漠不关心。强调“冷漠对待”。", a: "漠然置之"},
        {p: "曲调高雅，能附和的人少。比喻言论或作品高深，理解者少。强调“理解者少”。", a: "曲高和寡"},
        {p: "用尽兵力，肆意发动战争。指好战、滥用武力。强调“好战”。", a: "穷兵黩武"},
        {p: "比喻替别人冒险，自己却一无所获，或指被人利用去做冒险的事。", a: "火中取栗"},
        {p: "先派出的使者或队伍。指提前探路或联络的人。强调“提前探路”。", a: "先遣使"},
        {p: "先行动的人。指走在前面、开创道路的人。强调“开创先河”。", a: "先行者"},
        {p: "注入活力的泵。比喻激发活力的因素。强调“激发活力”。", a: "活力泵"},
        {p: "杆秤上的准星。比喻起决定作用的关键因素。强调“决定标准”。", a: "定盘星"},
        {p: "船底压舱的石块。比喻起稳定作用的关键因素。强调“稳定基础”。", a: "压舱石"},
        {p: "使加速的装置。比喻推动事物快速发展的因素。强调“推动加速”。", a: "加速器"},
        {p: "一池停滞不流的水.比喻沉闷、停滞不前的局面。强调“停滞、无生气”。", a: "一潭死水"},
        {p: "一张空白的文书。比喻没有实际效力的文件或承诺。强调“无实效”。", a: "一纸空文"},
        {p: "同根相连的树枝。比喻有血缘关系或关系密切。强调“血缘或密切关系”。", a: "同气连枝"},
        {p: "水和乳汁融合在一起。比喻关系非常融洽，结合紧密。强调“融为一体”。", a: "水乳交融"},
        {p: "像影子一样紧跟着。比喻关系密切，无法分离。强调“紧密伴随”。", a: "如影随形"},
        {p: "从上级到下级。指层层向下推进。强调“从上到下”。", a: "自上而下"},
        {p: "遇到异常情况，像平常一样对待。指处之泰然。强调“泰然处之”。", a: "安之若素"},
        {p: "能适应各种环境，在任何环境中都能满足。强调“适应力强”。强调“适应环境”。", a: "随遇而安"},
        {p: "沉着镇定地对待。指面对困难或紧急情况从容不迫。强调“沉着应对”。", a: "泰然处之"},
        {p: "超脱于世俗之外。指不把世俗名利放在心上。强调“超脱世俗”。", a: "超然物外"},
        {p: "气息平稳，神情悠闲。形容从容不迫、心态平和。强调“从容淡定”。", a: "气定神闲"},
        {p: "内心像静止的水一样平静。形容心境平和，不受外界干扰。强调“内心平静”。", a: "心如止水"},
        {p: "安于贫困，乐于信守道义。指不追求物质享受，以精神追求为乐。强调“安贫守道”。", a: "安贫乐道"},
        {p: "割取农作物。比喻获取利益或流量。强调“获取、攫取”。", a: "收割"},
        {p: "用手段换取、博得。指获取好感或信任。强调“换取、博得”。", a: "博取"},
        {p: "把隐藏的真相揭露出来。指使显露。强调“暴露真相”。", a: "揭示"},
        {p: "某种性质或现象在具体事物中表现出来。指具体表现。强调“具体表现”。", a: "体现"},
        {p: "把情况、意见等告诉上级。也指呈现、表现。强调“呈现、表现”。", a: "反映"},
        {p: "光线通过介质改变方向。比喻间接反映出某种情况。强调“间接反映”。", a: "折射"},
        {p: "从卵中破壳而出。比喻培育、孕育新事物。强调“培育产生”。", a: "孵化"},
        {p: "由主要事物中分化出来。指从源头分出。强调“派生分化”。", a: "派生"},
        {p: "由事物演变、发展而来。指从原有基础上发展出新的。强调“演变发展”。", a: "衍生"},
        {p: "促使产生、加速出现。指通过推动使新事物出现。强调“推动产生”。", a: "催生"},
        {p: "主动退让九十里。比喻退让、回避。强调“主动退让”。", a: "退避三舍"},
        {p: "虽然同情，但无力帮助。指有心无力。强调“有心无力”。", a: "爱莫能助"},
        {p: "把手放在袖子里，在一旁观看。比喻置身事外、不帮助。强调“不参与”。", a: "袖手旁观"},
        {p: "再度出任要职。比喻失败后重新崛起。强调“重新崛起”。", a: "东山再起"},
        {p: "卷起尘土，重新杀来。比喻失败后重新聚集力量再来。强调“重聚力量再来”。", a: "卷土重来"},
        {p: "某种观点、风气或事物广泛流行。指盛行。强调“广泛流行”。", a: "大行其道"},
        {p: "由强变弱、逐渐减退。指力量、水平、程度等减弱。强调“逐渐减退”。", a: "衰退"},
        {p: "由大变小、由强变弱。指收缩、缩小。强调“收缩变小”。", a: "萎缩"},
        {p: "颓败的趋势。指走向衰落的势头。强调“衰落趋势”。名词", a: "颓势"},
        {p: "由兴盛走向衰落。指由盛转衰。强调“由盛转衰”。", a: "式微"},
        {p: "使变弱.指力量、作用等减弱。强调“减弱”。", a: "削弱"},
        {p: "消除、化解。指使问题或矛盾消失。强调“消除化解”。", a: "消解"},
        {p: "使变弱、淡化。指减弱或降低重要性。强调“淡化减弱”。", a: "弱化"},
        {p: "加入溶剂使浓度降低。比喻使某种性质或力量减弱。强调“浓度降低”。", a: "稀释"},
        {p: "根据形势必须这样做。指非做不可。强调“必须执行、不得不做”。", a: "势在必行"},
        {p: "声势浩大、大规模地行事。指热烈、隆重地开展活动。强调“声势盛大、公开进行”。", a: "大张旗鼓"},
        {p: "一句话就说中要害。指言论精准，切中关键。强调“说话精准、切中要害”。", a: "一语中的"},
        {p: "按照身材剪裁衣服。比喻根据实际情况办事。强调“因地制宜、结合实际”。", a: "量体裁衣"},
        {p: "一天比一天厉害。指程度逐渐加深。强调“日益严重”。", a: "日甚一日"},
        {p: "太阿剑倒着拿。比喻把权力交给别人，自己反受其害。强调“授人以柄，反受其害”。", a: "太阿倒持"},
        {p: "使变淡、减弱。指使浓度或重要性降低。强调“浓度/重要性降低”。", a: "淡化"},
        {p: "一靠近就烫手。比喻权势大、气焰盛。强调“权势显赫”。", a: "炙手可热"},
        {p: "坚持、主持。指坚持某种原则或理念。强调“坚持原则”。", a: "秉持"},
        {p: "坚决保持、不放弃。指意志坚定。强调“不放弃”。", a: "坚持"},
        {p: "保卫、守护。指坚决维护，不让受侵犯。强调“坚决保卫”。", a: "捍卫"},
        {p: "接受、奉命。指按照上级或前人的指示去做。强调“奉命承接”。", a: "秉承"},
        {p: "书法笔势矫健、灵活。形容书法笔势雄健。强调“书法笔势”。", a: "笔走龙蛇"},
        {p: "别的山上的石头。比喻能帮助自己改正缺点、提高自己的外力。强调“借鉴外力”。", a: "他山之石"},
        {p: "能治好病的特效药。比喻能解决一切问题的好办法。强调“万能良药”。", a: "灵丹妙药"},
        {p: "独一无二的方法。指最好的、唯一的方法。强调“唯一最好的方法”。", a: "不二法门"},
        {p: "源头有流动的水。比喻事物发展的源泉和动力。强调“源泉动力”。", a: "源头活水"},
        {p: "温和润泽。形容人的品德温和如玉。强调“温和润泽”。", a: "温润而泽"},
        {p: "有空子就钻。比喻善于钻营，也指无处不渗透。强调“到处渗透”。", a: "无孔不入"},
        {p: "无论怎样摔打都不破。比喻理论或学说正确可靠，不可推翻。强调“正确可靠”。", a: "颠扑不破"},
        {p: "大方地拿出钱财帮助别人。指慷慨资助。强调“慷慨资助”。", a: "慷慨解囊"},
        {p: "把东西转交给别人。指传递、转交。强调“转交”。", a: "转送"},
        {p: "把事物转移给另一方。指正式交接。强调“正式交接”。", a: "移交"},
        {p: "将负担或责任转移给他人。指推卸转嫁.强调“转移责任”。", a: "转嫁"},
        {p: "将位置或方向改变。指移动到别处。强调“移动”。", a: "转移"},
        {p: "建立、建设。指从无到有地建立体系。强调“建设建立”。", a: "构建"},
        {p: "重新塑造。指改变原有面貌，重新建立。强调“重新塑造”。", a: "重塑"},
        {p: "谋划、计划。指事先拟定方案。强调“事先规划”。", a: "筹划"},
        {p: "计划、想办法。指有策略地规划安排。强调“策略规划”。", a: "谋划"},
        {p: "事先拟定的具体方案。指规划和安排。强调“具体安排”。", a: "计划"},
        {p: "为达成某个目标，事先进行周密的计划、安排和设计。", a: "策划"}
    ];

    // 为“全部题目”适配一套默认的成绩评定标准（比如按比例或固定秒数）
    const rules = {
        10:{e:15,g:20,p:30}, 
        20:{e:30,g:45,p:60}, 
        50:{e:75,g:110,p:150}, 
        100:{e:150,g:220,p:300},
        all:{e:1200,g:1800,p:2400} // 全部题目的用时标准（单位：秒）
    };
    let quiz = [], cur = 0, score = 0, startT, qStartT, timerT, records = [];

    function startQuiz(num) {
        // 如果传入的是 'all'，则将全部 812 题打乱顺序使用；否则截取对应数量
        if (num === 'all') {
            quiz = [...data].sort(() => Math.random() - 0.5);
        } else {
            quiz = [...data].sort(() => Math.random() - 0.5).slice(0, num);
        }

        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        const r = rules[num] || {e:20, g:30, p:40};
        document.getElementById('grade-standards').innerHTML = `优秀:${r.e}s 良好:${r.g}s 合格:${r.p}s`;
        
        startT = Date.now();
        qStartT = Date.now();
        timerT = setInterval(() => {
            let s = Math.floor((Date.now()-startT)/1000);
            document.getElementById('timer').innerText = Math.floor(s/60)+":"+String(s%60).padStart(2,'0');
        }, 1000);
        render();
    }
    function render() {
        if(cur >= quiz.length) return finish();
        document.getElementById('answer-display').style.visibility = 'hidden';
        document.getElementById('q-val').innerText = quiz[cur].p;
        document.getElementById('hint-val').innerText = quiz[cur].a;
        document.getElementById('answer-input').value = '';
        document.getElementById('answer-input').focus();
        qStartT = Date.now();
    }
    function nextStep() {
        let val = document.getElementById('answer-input').value.trim();
        let isOk = (val === quiz[cur].a);
        let timePerQ = ((Date.now() - qStartT)/1000).toFixed(1);
        if(isOk) score++;
        records.push({q: quiz[cur].p, u: val, a: quiz[cur].a, s: isOk, t: timePerQ});
        cur++;
        render();
    }
    function finish() {
        clearInterval(timerT);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('res-score').innerText = `${score}/${quiz.length}`;
        document.getElementById('res-time').innerText = document.getElementById('timer').innerText;
        document.getElementById('res-body').innerHTML = records.map(r => `<tr class="${r.s?'':'row-wrong'}"><td>${r.q}</td><td>${r.u}</td><td>${r.a}</td><td>${r.t}s</td></tr>`).join('');
        saveHistory();
    }
    function saveHistory() {
        let h = JSON.parse(localStorage.getItem('idiom_hist') || '[]');
        h.push({date: new Date().toLocaleDateString(), s: score, t: quiz.length});
        localStorage.setItem('idiom_hist', JSON.stringify(h));
    }
    function clearHistory() { localStorage.removeItem('idiom_hist'); location.reload(); }
    window.onload = () => {
        let h = JSON.parse(localStorage.getItem('idiom_hist') || '[]');
        if(h.length) {
            document.getElementById('history-section').classList.remove('hidden');
            document.getElementById('total-accuracy-box').classList.remove('hidden');
            let s = h.reduce((a,b)=>a+b.s,0), t = h.reduce((a,b)=>a+b.t,0);
            document.getElementById('total-acc').innerText = Math.round(s/t*100) + '%';
            document.getElementById('history-list').innerHTML = h.map(i=>`<div style="padding:5px;">${i.date}: ${i.s}/${i.t}</div>`).join('');
        }
    };
    document.onkeyup = (e) => { if(e.key === 'Enter') nextStep(); };
</script>
</body>
</html>
